<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baralla</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3ebdc">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --tapete: #2c5a3c; --tapete-escuro: #1b3a27; --madeira: #5e4127; --madeira-clara: #7d5936;
  --crema: #f2e7cb; --tinta: #2a2116; --ouro: #d9a93b; --vermello: #b4412f;
  --panel: #16241b; --texto: #f5efe0; --suave: #c9bea3; --liña: rgba(242, 231, 203, .22);
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
}
html { scroll-padding-top: var(--safe-top); }
html, body { height: 100%; margin: 0; }
body { font-family: 'Nunito', system-ui, sans-serif; color: var(--texto); background: var(--tapete-escuro); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
*, *::before, *::after { box-sizing: inherit; }
h1, h2 { font-family: 'Bricolage Grotesque', 'Nunito', system-ui, sans-serif; font-weight: 700; letter-spacing: 0; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }
.oculto { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- inicio: papel e tinta ---------- */
#inicio { --papel: #f3ebdc; --papel-2: #fbf7ef; --tinta-i: #1d1a16; --tinta-2: #6b6255; --raia: #d9cdb6; --acento: #b4412f;
  flex: 1; overflow: auto; padding: 10px 14px 24px; background: var(--papel); color: var(--tinta-i);
  background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 6px 6px; }
#inicio .col { max-width: 520px; margin: 0 auto; }
#inicio .cabeceira { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 10px; }
#inicio h1 { font-size: 46px; margin: 0; line-height: .9; font-weight: 800; letter-spacing: -.03em; }
#inicio h1 small { display: block; font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 12px; color: var(--tinta-2); letter-spacing: .02em; margin-top: 4px; }
.ferramentas { display: flex; align-items: center; gap: 6px; }
.bandeiras { display: flex; gap: 4px; }
.bandeiras button { width: 30px; height: 21px; padding: 0; border: 0; border-radius: 3px; overflow: hidden; opacity: .45; outline-offset: 1px; filter: saturate(.7); }
.bandeiras button svg { width: 100%; height: 100%; display: block; }
.bandeiras button[aria-pressed=true] { opacity: 1; filter: none; box-shadow: 0 0 0 2px var(--tinta-i); }
.manual { display: inline-flex; align-items: center; gap: 4px; border: 1.5px solid var(--tinta-i); background: var(--papel-2); border-radius: 8px; padding: 4px 8px; font-weight: 700; font-size: 12px; color: var(--tinta-i); }
.manual svg { width: 16px; height: 16px; }
.seg { display: flex; border: 1.5px solid var(--tinta-i); border-radius: 10px; padding: 2px; background: var(--papel-2); margin-bottom: 8px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--tinta-2); padding: 7px 4px; border-radius: 7px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.seg button[aria-pressed=true] { background: var(--tinta-i); color: var(--papel); }
.liña1 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; align-items: stretch; }
.liña1 input { height: 100%; }
#inicio input[type=text] { font: inherit; font-size: 15px; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--tinta-i); background: var(--papel-2); color: var(--tinta-i); width: 100%; min-width: 0; }
#inicio input[type=text]::placeholder { color: #a39885; }
#skin-btn { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; border: 1.5px solid var(--tinta-i); background: var(--papel-2); border-radius: 10px; padding: 3px 6px; }
#skin-panel { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin: -2px 0 6px; scroll-snap-type: x mandatory; }
#skin-panel button { flex: 0 0 auto; scroll-snap-align: start; border: 1.5px solid var(--raia); background: var(--papel-2); padding: 5px 6px 4px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--tinta-2); }
#skin-panel .paus { display: flex; gap: 2px; }
#skin-panel .paus img { width: 30px; height: 30px; display: block; }
#skin-panel button[aria-pressed=true] { border-color: var(--tinta-i); color: var(--tinta-i); box-shadow: 0 2px 0 var(--tinta-i); }
.opcions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 6px; }
.opcion { border: 1.5px solid var(--tinta-i); background: var(--papel-2); border-radius: 10px; padding: 5px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; box-shadow: 0 2px 0 var(--tinta-i); transition: transform .08s, box-shadow .08s; }
.opcion:active { transform: translateY(2px); box-shadow: 0 0 0 var(--tinta-i); }
.opcion b { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(14px, 4.4vw, 20px); white-space: nowrap; line-height: 1.1; color: var(--tinta-i); }
#ciclos[style*="repeat(6"] .opcion span { font-size: 8px; letter-spacing: 0; }
#ciclos[style*="repeat(6"] .opcion b { font-size: clamp(13px, 4vw, 18px); }
.opcion span { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.chips { display: flex; flex-wrap: nowrap; gap: 5px; margin-bottom: 10px; align-items: center; }
.chip.tx { flex: 1 1 0; min-width: 0; height: 28px; padding: 0 6px; font-size: 12px; gap: 4px; white-space: nowrap; }
.chip.tx::before { width: 7px; height: 7px; }
.chip-lenda { font-size: 11px; color: var(--tinta-2); flex: 1; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 5px; border: 1.5px solid var(--raia); background: transparent; border-radius: 999px; padding: 5px 6px; font-size: 12px; font-weight: 700; color: var(--tinta-2); }
.chip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
.chip[aria-checked=true] { border-color: var(--tinta-i); color: var(--tinta-i); background: var(--papel-2); }
.chip[aria-checked=true]::before { background: var(--acento); border-color: var(--acento); }
.bloque { border: 1.5px solid var(--raia); background: var(--papel-2); border-radius: 12px; padding: 8px 10px 10px; margin-bottom: 8px; }
.bloque h2 { font-size: 16px; margin: 0 0 6px; }
.fila { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; color: var(--tinta-2); }
.principal { width: 100%; padding: 13px; border-radius: 12px; border: 0; background: var(--acento); color: #fff; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; margin-top: 2px; box-shadow: 0 3px 0 #7c2a1f; }
.principal:active { transform: translateY(2px); box-shadow: 0 1px 0 #7c2a1f; }
.principal:disabled { opacity: .5; cursor: default; }
.secundario { border: 1.5px solid var(--tinta-i); background: var(--papel-2); border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 13px; color: var(--tinta-i); }
.erro { background: var(--vermello); color: #fff; padding: 8px 12px; border-radius: 10px; margin: 8px 0; font-size: 14px; }
.asentos-sala { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.asentos-sala button { padding: 8px 10px; border-radius: 10px; border: 1.5px dashed var(--raia); background: transparent; text-align: left; font-size: 13px; color: var(--tinta-i); }
.asentos-sala button.eu { border-style: solid; border-color: var(--tinta-i); }
.asentos-sala small { display: block; color: var(--tinta-2); }

/* portal de xogos compacto */
.filtro-xogos { display: flex; gap: 6px; justify-content: flex-end; margin: -2px 0 5px; }
.filtro { border: 0; background: none; color: var(--tinta-2); font-size: 11.5px; font-weight: 700; padding: 2px 4px; border-bottom: 1.5px dotted var(--tinta-2); }
.filtro.activo { color: var(--acento); border-color: var(--acento); }
.desc-xogo { margin: 4px 2px 10px; font-size: 12px; color: var(--tinta-2); min-height: 15px; }
.desc-xogo b { color: var(--tinta-i); }
.aparencia { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
#skin-btn.sel-ap { flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px 3px; }
.sel-ap { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1.5px solid var(--tinta-i); background: var(--papel-2); border-radius: 10px; padding: 4px 2px 3px; min-width: 0; }
.sel-ap .et { order: 2; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--tinta-2); }
.sel-ap .et::after { content: ' ▾'; }
.sel-ap[aria-expanded=true] { background: var(--tinta-i); } .sel-ap[aria-expanded=true] .et { color: var(--papel); }
.mostra-ap { display: flex; gap: 1px; align-items: center; justify-content: center; height: 42px; }
.mostra-ap img { width: 28px; height: 42px; display: block; border-radius: 3px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }

.mostra-ap i { display: block; width: 34px; height: 34px; border-radius: 50%; }
#skin-panel { gap: 8px; padding: 4px 2px 10px; }
#skin-panel button { padding: 6px 8px 5px; gap: 4px; font-size: 12px; }
#skin-panel .cart-op .tres { display: flex; }
#skin-panel .cart-op .tres img { width: 42px; height: 63px; margin-left: -16px; border-radius: 4px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
#skin-panel .cart-op .tres img:first-child { margin-left: 0; }
#skin-panel .rev-op img { width: 46px; height: 69px; border-radius: 5px; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
#skin-panel .tap-op i { display: block; width: 69px; height: 69px; border-radius: 12px; }

.xogos { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 2px; }

.xogo { position: relative; border: 1.5px solid var(--tinta-i); background: var(--papel-2); border-radius: 999px; padding: 4px 10px 3px; display: flex; align-items: center; color: var(--tinta-i); box-shadow: 0 2px 0 var(--tinta-i); flex: 0 0 auto; }
.xogo.apagado { opacity: .3; box-shadow: none; }
.xogo b { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-stretch: condensed; font-weight: 800; font-size: 16px; white-space: nowrap; line-height: .95; text-transform: uppercase; letter-spacing: .01em; }
.xogo small { font-size: 10.5px; color: var(--tinta-2); line-height: 1.2; margin-top: 2px; }
.xogo .paus { position: absolute; top: 6px; right: 6px; display: flex; gap: 0; opacity: .9; }
.xogo .paus img { width: 16px; height: 16px; }
.xogo[aria-pressed=true] { background: var(--tinta-i); color: var(--papel); }
.xogo[aria-pressed=true] small { color: #c9bea3; }
.xogo[aria-pressed=true] .paus { background: var(--papel-2); border-radius: 6px; padding: 1px; }
.mais-xogos { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; padding-bottom: 2px; }
.mais-xogos span { flex: 0 0 auto; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: .03em; font-size: 13px; font-weight: 700; color: var(--tinta-2); border: 1.5px dashed var(--raia); border-radius: 999px; padding: 3px 9px; }


/* ---------- mesa de bazas (brisca, tute) ---------- */
#mesa-b { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; background: radial-gradient(ellipse at 50% 40%, var(--tapete) 0%, var(--tapete-escuro) 85%); }
.barra { display: flex; justify-content: space-between; align-items: center; padding: 3px 6px 3px 10px; font-size: 12px; color: var(--suave); background: rgba(0,0,0,.3); white-space: nowrap; }
.barra button { background: none; border: 0; color: var(--suave); padding: 4px 6px; font-size: 12px; }
.marcador-x { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; background: var(--madeira); border-bottom: 3px solid var(--madeira-clara); box-shadow: 0 3px 0 rgba(0,0,0,.35); min-height: 52px; }
.chips-m { display: flex; gap: 5px; flex-wrap: nowrap; min-width: 0; overflow: hidden; }
.chips-m:has(.chip-m:nth-child(4)) .chip-m { min-width: 0; padding: 2px 6px; }
.chips-m:has(.chip-m:nth-child(4)) .chip-m span { max-width: 58px; }
.chips-m:has(.chip-m:nth-child(4)) .chip-m small { font-size: 9px; }
.chips-m:has(.chip-m:nth-child(5)) { flex-wrap: wrap; gap: 3px; }
.chips-m:has(.chip-m:nth-child(5)) .chip-m { flex-direction: row; align-items: baseline; gap: 4px; padding: 1px 6px; }
.chips-m:has(.chip-m:nth-child(5)) .chip-m b { font-size: 14px; }
.chips-m:has(.chip-m:nth-child(5)) .chip-m small { display: none; }
.chip-m { display: flex; flex-direction: column; background: rgba(0,0,0,.22); border-radius: 8px; padding: 3px 8px; min-width: 54px; }
.chip-m b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; color: var(--ouro); line-height: 1.1; }
.chip-m span { font-size: 11px; color: var(--crema); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
.chip-m small { font-size: 10px; color: var(--suave); }
.chip-m.eu { outline: 1.5px solid var(--ouro); }
.chip-m.fora { opacity: .4; text-decoration: line-through; }
#marcador-b small { font-size: 11px; color: var(--suave); }
#centro-b { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex: 0 0 auto; }
#triunfo-b { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--crema); }
#triunfo-b img { width: 30px; aspect-ratio: 2/3; transform: rotate(90deg); margin: -6px 6px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
#tapete-b { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr minmax(0, 2.2fr) 1fr; grid-template-rows: auto 1fr; gap: 4px; padding: 6px 8px 0; align-items: center; overflow: hidden; }
.asento-b { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.asento-b.esquerda { grid-column: 1; grid-row: 2; }
.asento-b.dereita { grid-column: 3; grid-row: 2; }
.asento-b .etiqueta { font-size: 12px; color: var(--suave); display: flex; gap: 4px; align-items: center; max-width: 100%; }
.asento-b .etiqueta b { color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.asento-b.turno .etiqueta b { color: var(--ouro); }
.asento-b .cartas img { width: min(7vw, 30px); aspect-ratio: 2/3; margin-left: calc(min(7vw, 30px) * -.55); filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.asento-b .cartas img:first-child { margin-left: 0; }
.asento-b.esquerda .cartas, .asento-b.dereita .cartas { flex-direction: column; }
.asento-b.esquerda .cartas img, .asento-b.dereita .cartas img { margin-left: 0; margin-top: calc(min(7vw, 30px) * -1.1); }
.asento-b.esquerda .cartas img:first-child, .asento-b.dereita .cartas img:first-child { margin-top: 0; }
#tapete-b .arriba-fila, #tapete-c .arriba-fila { grid-column: 2; grid-row: 1; display: flex; justify-content: space-around; gap: 4px; min-width: 0; }
.arriba-fila .asento-b .cartas img { width: min(6vw, 26px); }
.arriba-fila:has(.asento-b:nth-child(3)) .asento-b .cartas img { width: min(4.6vw, 20px); }
.arriba-fila .asento-b .etiqueta { font-size: 11px; }
#baza-b { grid-column: 2; grid-row: 2; position: relative; height: min(78vw, 42vh, 320px); }
#baza-b .slot { position: absolute; left: 50%; top: 50%; width: min(14vw, 9vh, 72px); aspect-ratio: 2/3; transform: translate(-50%, -50%); }

#baza-b .slot img { width: 100%; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); animation: lanzar .25s ease-out both; }
#baza-b.pasada .slot img { opacity: .55; animation: none; }
#baza-b .slot.gaña img { outline: 3px solid var(--ouro); border-radius: 6px; opacity: 1; }
@keyframes lanzar { from { transform: scale(.7) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.aviso-b { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; width: max-content; max-width: 92%; text-align: center; font-size: 12px; font-weight: 700; color: var(--crema); background: rgba(12,18,14,.82); border-radius: 999px; padding: 4px 10px; pointer-events: none; }
.aviso-b:empty { display: none; }
#abaixo-b { background: var(--panel); border-top: 1px solid rgba(255,255,255,.06); padding: 6px 8px calc(6px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 6px; }
#eu-b { display: flex; justify-content: space-between; padding: 0 4px; font-size: 12px; color: var(--suave); }
#eu-b b { color: var(--texto); }
#man-b { display: flex; justify-content: center; padding-top: 10px; }
#man-b button { padding: 0; border: 0; background: none; margin-left: var(--solape, 4px); transition: transform .12s; }
#man-b button:first-child { margin-left: 0; }
#man-b img { width: var(--ancho-m, min(18vw, 13vh, 96px)); aspect-ratio: 2/3; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
#man-b button.xogable:hover, #man-b button.xogable:focus-visible { transform: translateY(-10px); }
#man-b button.non img { filter: brightness(.55) saturate(.6); }
#man-b button:disabled { cursor: default; }
#accions-b { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 36px; align-items: center; }
#accions-b button { padding: 8px 14px; border-radius: 10px; border: 0; background: var(--ouro); color: var(--tinta); font-weight: 700; font-size: 14px; }
#accions-b .espera { color: var(--suave); font-size: 13px; }
#accions-b button.secundario-b { background: var(--crema); }
#accions-b button.num-b { min-width: 40px; padding: 8px 0; }
.asento-b .etiqueta i, #eu-b-man i { font-style: normal; color: var(--ouro); font-size: 11px; margin-left: 4px; }
#conta-b { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); z-index: 3; background: var(--crema); color: var(--tinta); padding: 10px 14px; border-radius: 12px; font-size: 14px; box-shadow: 0 6px 16px rgba(0,0,0,.4); min-width: 220px; text-align: center; }
#conta-b h3 { margin: 0 0 6px; font-size: 20px; }
#conta-b table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
#conta-b td { padding: 2px 4px; text-align: left; } #conta-b td:last-child { text-align: right; font-weight: 700; }
#conta-b button { border: 0; background: var(--vermello); color: #fff; font-weight: 700; border-radius: 10px; padding: 8px 14px; }


/* ---------- mesa de escoba, chinchón e cuadrado ---------- */
#mesa-c { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; background: radial-gradient(ellipse at 50% 40%, var(--tapete) 0%, var(--tapete-escuro) 85%); }
#tapete-c { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr minmax(0, 2.6fr) 1fr; grid-template-rows: auto 1fr; gap: 4px; padding: 6px 8px 0; align-items: center; overflow: hidden; }

#centro-c { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
#centro-c .mesa-cartas { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 100%; }
#centro-c .mesa-cartas img, #centro-c .mesa-cartas button img { width: min(14vw, 9vh, 66px); aspect-ratio: 2/3; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
#centro-c .mesa-cartas button { padding: 0; border: 0; background: none; border-radius: 6px; }
#centro-c .mesa-cartas button.sel img, #man-c button.sel img { outline: 3px solid var(--ouro); border-radius: 6px; }
#centro-c .mesa-cartas .nova img { animation: lanzar .3s ease-out both; }
#centro-c .info-c { font-size: 12px; color: var(--suave); text-align: center; }
#centro-c .monte { display: flex; gap: 14px; align-items: flex-end; }
#centro-c .monte button { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--crema); font-size: 11px; }
#centro-c .monte img { width: min(17vw, 11vh, 80px); aspect-ratio: 2/3; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
#centro-c .monte button.activo img { outline: 3px solid var(--ouro); border-radius: 6px; }
#centro-c .monte button:disabled { cursor: default; }
.aviso-c { font-size: 12px; font-weight: 700; color: var(--crema); background: rgba(12,18,14,.82); border-radius: 999px; padding: 4px 10px; min-height: 1px; }

#abaixo-c { background: var(--panel); border-top: 1px solid rgba(255,255,255,.06); padding: 6px 8px calc(6px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 6px; }
#eu-c { display: flex; justify-content: space-between; padding: 0 4px; font-size: 12px; color: var(--suave); }
#eu-c b { color: var(--texto); }
#man-c { display: flex; justify-content: center; padding-top: 10px; flex-wrap: nowrap; }
#man-c button { padding: 0; border: 0; background: none; margin-left: var(--solape, 4px); transition: transform .12s; }
#man-c button:first-child { margin-left: 0; }
#man-c button.hoco { margin-left: 10px; }
#man-c img { width: var(--ancho-m, min(19vw, 13vh, 96px)); aspect-ratio: 2/3; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
#man-c button.sel { transform: translateY(-10px); }
#man-c button.non img { filter: brightness(.55) saturate(.6); }
.cinquillo { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.fila-cinq { display: flex; justify-content: center; min-height: min(10vw, 6vh, 48px); }
.fila-cinq img { width: min(7.5vw, 4.6vh, 34px); aspect-ratio: 2/3; margin-left: calc(min(7.5vw, 4.6vh, 34px) * -.45); filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.fila-cinq img:first-child { margin-left: 0; }
#man-c button.xogada img { box-shadow: 0 -4px 0 var(--ouro); border-radius: 6px; }
#accions-c { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; min-height: 38px; }
#accions-c button { padding: 8px 12px; border-radius: 10px; border: 0; background: var(--crema); color: var(--tinta); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
#accions-c button.forte { background: var(--ouro); }
#accions-c button.perigo { background: var(--vermello); color: #fff; }

#accions-c button img { width: 22px; aspect-ratio: 2/3; }
#accions-c .espera { color: var(--suave); font-size: 13px; }
#conta-c { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); z-index: 3; background: var(--crema); color: var(--tinta); padding: 10px 14px; border-radius: 12px; font-size: 14px; box-shadow: 0 6px 16px rgba(0,0,0,.4); min-width: 240px; max-width: 92vw; text-align: center; }
#conta-c h3 { margin: 0 0 6px; font-size: 20px; }
#conta-c table { width: 100%; border-collapse: collapse; margin-bottom: 6px; font-size: 13px; }
#conta-c td { padding: 2px 4px; text-align: left; } #conta-c td:last-child { text-align: right; font-weight: 700; }
#conta-c button { border: 0; background: var(--vermello); color: #fff; font-weight: 700; border-radius: 10px; padding: 8px 14px; }
#conta-c .cartas-ex { display: flex; gap: 2px; justify-content: center; margin: 4px 0; }
#conta-c .cartas-ex img { width: 34px; aspect-ratio: 2/3; }


#historial { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; max-height: 55%; overflow: auto; background: rgba(12,18,14,.97); color: var(--suave); padding: 10px 14px calc(12px + var(--safe-bottom)); font-size: 13px; border-top: 1px solid var(--liña); }
#historial p { margin: 3px 0; } #historial p:first-of-type { color: var(--crema); }
#historial .pechar { float: right; background: none; border: 0; color: var(--ouro); font-size: 13px; }
/* chat, guía, estatísticas, tapetes */
.chat-fila { position: absolute; top: 30px; right: 8px; z-index: 30; display: flex; flex-direction: column; gap: 4px; background: var(--panel); padding: 6px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.chat-fila button { border: 0; background: var(--crema); color: var(--tinta); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; text-align: left; }
.guia { position: fixed; left: 50%; bottom: calc(150px + var(--safe-bottom)); transform: translateX(-50%); z-index: 45; width: min(92vw, 420px); background: #fbf7ef; color: #1d1a16; border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); border: 2px solid #1d1a16; }
.guia b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; }
.guia p { margin: 6px 0 10px; font-size: 14px; line-height: 1.4; }
.guia div { display: flex; gap: 8px; justify-content: flex-end; }
.guia button { border: 0; border-radius: 10px; padding: 7px 12px; font-weight: 700; }
.guia .g-ok { background: #b4412f; color: #fff; } .guia .g-non { background: transparent; color: #6b6255; }
table.stats { width: 100%; border-collapse: collapse; font-size: 14px; }
table.stats th { text-align: right; font-size: 11px; color: #6b6255; font-weight: 700; text-transform: uppercase; padding: 4px; }
table.stats td { padding: 5px 4px; text-align: right; border-top: 1px solid #d9cdb6; }
table.stats td:first-child { text-align: left; }
.tapetes-fila { display: flex; align-items: center; gap: 8px; margin: -2px 0 10px; font-size: 12px; font-weight: 700; color: var(--tinta-2); }
#tapetes { display: flex; gap: 6px; }
#tapetes button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
#tapetes button[aria-pressed=true] { border-color: var(--tinta-i); box-shadow: 0 0 0 2px var(--papel); }
.chip.nivel { border-color: var(--tinta-i); color: var(--tinta-i); background: var(--papel-2); white-space: nowrap; flex: 1 1 auto; height: 28px; padding: 0 8px; font-size: 12px; }
.chip.nivel::before { display: none; }
/* arrastrar */
button img, .cartas img, .sol img { -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none; }
.fantasma img { box-shadow: 0 10px 24px rgba(0,0,0,.45); border-radius: 6px; }
.drop-ok { outline: 3px dashed var(--ouro); outline-offset: 4px; border-radius: 10px; }
/* solitario */
#mesa-c.solitario #tapete-c { display: block; overflow-y: auto; padding: 8px 6px 0; }
#mesa-c.solitario #centro-c { display: block; }
#mesa-c.solitario #man-c, #mesa-c.solitario #eu-c { display: none; }
.sol { --sol-ancho: min(calc((100vw - 40px) / 7), 64px); --sol-alto: calc(var(--sol-ancho) * 1.5); max-width: 480px; margin: 0 auto; }
.sol-arriba { display: flex; align-items: flex-start; gap: 5px; margin-bottom: 10px; }
.sol-funds { display: flex; gap: 5px; margin-left: auto; }
.sol-descarte { position: relative; width: calc(var(--sol-ancho) + 28px); height: var(--sol-alto); }
.sol-descarte .sol-carta { position: absolute; top: 0; }
.sol-carta { width: var(--sol-ancho); height: var(--sol-alto); padding: 0; border: 0; background: none; position: relative; border-radius: 5px; display: flex; }
.sol-carta img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
.sol-carta.oco { border: 1.5px dashed rgba(242,231,203,.35); color: var(--suave); align-items: center; justify-content: center; font-size: 20px; }
.sol-carta small { position: absolute; right: 2px; bottom: 2px; font-size: 10px; background: rgba(0,0,0,.6); color: #fff; border-radius: 6px; padding: 0 4px; }
.sol-carta.sel img { outline: 3px solid var(--ouro); border-radius: 5px; }
.sol-cols { display: grid; grid-template-columns: repeat(7, var(--sol-ancho)); justify-content: space-between; gap: 4px; }
.sol-col { position: relative; min-height: var(--sol-alto); }
.sol-col .sol-carta { position: absolute; left: 0; }
.sol-col > .sol-carta.oco { position: static; }

/* ---------- mesa ---------- */
#mesa { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; background: radial-gradient(ellipse at 50% 35%, var(--tapete) 0%, var(--tapete-escuro) 85%); }
#barra { display: flex; justify-content: space-between; align-items: center; padding: 3px 6px 3px 10px; font-size: 12px; white-space: nowrap; color: var(--suave); background: rgba(0,0,0,.3); }
#barra button { background: none; border: 0; color: var(--suave); padding: 4px 6px; font-size: 12px; }
#marcador { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 12px; background: var(--madeira); border-bottom: 3px solid var(--madeira-clara); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.equipo { display: flex; flex-direction: column; gap: 3px; }
.equipo.eles { align-items: flex-end; }
.equipo .nome { font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; color: var(--crema); }
.equipo .nome span { color: var(--ouro); margin-left: 6px; }
.garbanzos { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; min-height: 24px; }
.equipo.eles .garbanzos { justify-content: flex-end; }
.garbanzos svg { display: block; }
.garbanzos .amarrako { width: 25px; height: 25px; }
.garbanzos .pedra { width: 17px; height: 17px; }
#centro-marcador { text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; color: var(--crema); line-height: 1.2; }
#centro-marcador small { display: block; color: var(--suave); font-family: 'Nunito', sans-serif; font-size: 11px; }
#tapete { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr minmax(0, 2fr) 1fr; grid-template-rows: auto 1fr; gap: 4px; padding: 6px 8px 0; align-items: center; overflow: hidden; }
.asento { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.asento.arriba { grid-column: 2; grid-row: 1; }
.asento.esquerda { grid-column: 1; grid-row: 2; align-self: start; }
.asento.dereita { grid-column: 3; grid-row: 2; align-self: start; }
.asento .etiqueta { font-size: 12px; color: var(--suave); display: flex; gap: 5px; align-items: center; max-width: 100%; }
.asento .etiqueta b { color: var(--texto); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.man { background: var(--ouro); color: var(--tinta); border-radius: 6px; padding: 0 5px; font-size: 10px; font-weight: 700; }
.asento.turno .etiqueta b { color: var(--ouro); }
.dito { min-height: 18px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; color: var(--crema); }
.dito.conta-atras { color: var(--ouro); font-variant-numeric: tabular-nums; }
.cartas { display: flex; gap: 3px; justify-content: center; }
.cartas img { aspect-ratio: 2/3; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
.asento.arriba .cartas img { width: min(13vw, 9vh, 70px); }
.asento.esquerda .cartas, .asento.dereita .cartas { flex-direction: column; }
.asento.esquerda .cartas img, .asento.dereita .cartas img { width: min(11vw, 7vh, 54px); margin-top: calc(min(11vw, 7vh, 54px) * -1.1); }
.asento.esquerda .cartas img:first-child, .asento.dereita .cartas img:first-child { margin-top: 0; }
#lance { grid-column: 2; grid-row: 2; text-align: center; align-self: center; padding: 0 4px; }
#lance .nome-lance { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(22px, 6vw, 34px); color: var(--crema); text-shadow: 0 2px 0 rgba(0,0,0,.35); line-height: 1.1; }
#lance .envite { font-size: 14px; color: var(--ouro); min-height: 18px; }
#lance .info { font-size: 12px; color: var(--suave); }
#lance .aviso { font-size: 12px; color: var(--crema); }
#abaixo { background: var(--panel); border-top: 1px solid rgba(255,255,255,.06); padding: 6px 8px calc(4px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 6px; }
#eu { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; font-size: 12px; color: var(--suave); }
#eu b { color: var(--texto); }
#eu .dito { font-size: 14px; }
#man .cartas img { width: min(21vw, 15vh, 110px); transition: transform .15s; }
@keyframes repartir { from { transform: translate(-30vw, -45vh) rotate(-20deg) scale(.6); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
.cartas img.nova { animation: repartir .45s cubic-bezier(.2,.8,.3,1) both; }
#man .cartas button[aria-pressed=true] img.nova { animation: none; }
#man .cartas button { padding: 0; border: 0; background: none; border-radius: 8px; }
#man .cartas button[aria-pressed=true] img { transform: translateY(-10px); outline: 3px solid var(--ouro); outline-offset: -1px; border-radius: 6px; }
#accions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; min-height: 42px; }
#accions button { padding: 9px 14px; border-radius: 10px; border: 0; background: var(--crema); color: var(--tinta); font-weight: 700; font-size: 14px; }
#accions button.forte { background: var(--ouro); }
#accions button.perigo { background: var(--vermello); color: #fff; }
#accions button:disabled { opacity: .45; cursor: default; }
#accions .grupo { display: flex; align-items: center; gap: 4px; }
#accions input[type=number] { width: 54px; font: inherit; padding: 8px 4px; border-radius: 8px; border: 0; text-align: center; background: var(--crema); color: var(--tinta); }
#accions .espera { color: var(--suave); font-size: 13px; }
#sinais { display: flex; gap: 2px; justify-content: center; align-items: flex-start; overflow-x: auto; }
#sinais button { width: 41px; padding: 2px 0 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--suave); flex: 0 0 auto; }
#sinais button svg { width: 28px; height: 28px; }
#sinais button small { font-size: 9px; line-height: 1; white-space: nowrap; }
#sinais button.feita svg { color: var(--ouro); }
#sinais button small { font-size: 8.5px; }
#conta, #fin { position: absolute; left: 50%; transform: translateX(-50%); z-index: 3; }
#conta { top: 34%; background: var(--crema); color: var(--tinta); padding: 8px 12px; border-radius: 12px; font-size: 13px; box-shadow: 0 6px 16px rgba(0,0,0,.4); min-width: 200px; }
#conta table { width: 100%; border-collapse: collapse; }
#conta td { padding: 2px 4px; }
#conta td:last-child { text-align: right; font-weight: 700; }
#fin { top: 30%; background: var(--panel); padding: 16px 20px; border-radius: 14px; text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,.5); }
#fin h2 { font-size: 32px; margin: 0 0 8px; color: var(--ouro); }
#xogadas { position: absolute; inset: auto 0 0 0; z-index: 4; max-height: 60%; overflow: auto; background: rgba(12, 18, 14, .96); padding: 10px 14px calc(12px + var(--safe-bottom)); font-size: 13px; color: var(--suave); border-top: 1px solid var(--liña); }
#xogadas p { margin: 3px 0; }
#xogadas p.nos { color: var(--crema); }
#xogadas p.pedras { color: var(--ouro); }
#xogadas .pechar { float: right; background: none; border: 0; color: var(--ouro); font-size: 13px; }
#normas { position: fixed; inset: 0; z-index: 20; overflow: auto; background: #f3ebdc; background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 6px 6px; padding: 14px 16px calc(20px + var(--safe-bottom)); font-size: 14px; color: #1d1a16; line-height: 1.45; }
#normas .col { max-width: 640px; margin: 0 auto; }
#normas h2 { color: #1d1a16; font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 2px solid #1d1a16; }
#normas h3 { color: #b4412f; font-size: 17px; margin: 18px 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; }
#normas p { margin: 4px 0; color: #3a342b; }
#normas .exemplo { margin: 8px 0; }
#normas .cartas-ex { display: flex; gap: 3px; flex-wrap: nowrap; }
#normas .cartas-ex img { width: min(10.5vw, 52px); aspect-ratio: 2/3; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
#normas figcaption { font-size: 12px; color: #6b6255; margin-top: 3px; font-style: italic; }
#normas .exemplos { display: flex; flex-wrap: wrap; gap: 6px 10px; }
#normas .exemplos .exemplo { flex: 0 1 auto; max-width: 100%; }
#normas .principal { background: #b4412f; color: #fff; box-shadow: 0 3px 0 #7c2a1f; border: 0; border-radius: 12px; width: 100%; padding: 13px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; }
#normas .exemplos .cartas-ex img { width: min(9.5vw, 46px); }
#normas .exemplo { background: #fbf7ef; border: 1.5px solid #d9cdb6; border-radius: 10px; padding: 6px; }
#normas .sinais-ex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; margin-top: 8px; }
#normas .sinais-ex div { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
#normas .sinais-ex svg { width: 40px; height: 40px; color: #1d1a16; }
#normas .sinais-ex b { font-size: 13px; color: #1d1a16; }
#normas .sinais-ex small { font-size: 11px; color: #6b6255; line-height: 1.2; }
#normas .normas-cab { position: sticky; top: -14px; z-index: 2; display: flex; gap: 8px; align-items: center; background: #f3ebdc; padding: 10px 0 8px; margin: -14px 0 10px; border-bottom: 1.5px solid #d9cdb6; }
#normas .pestanas { display: flex; gap: 5px; overflow-x: auto; flex: 1; scrollbar-width: none; }
#normas .pestana { flex: 0 0 auto; border: 1.5px solid #1d1a16; background: #fbf7ef; color: #1d1a16; border-radius: 999px; padding: 4px 10px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 14px; letter-spacing: .02em; }
#normas .pestana.activa { background: #1d1a16; color: #f3ebdc; }
#normas .normas-cab .pechar { float: none; flex: 0 0 auto; }
#normas .pechar { float: right; background: #1d1a16; color: #f3ebdc; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; }
@media (min-width: 720px) { #inicio .col { max-width: 640px; } .fila { grid-template-columns: 110px 1fr; } }
</style>
</head>
<body>

<section id="inicio">
  <div class="col">
    <div class="cabeceira">
      <h1><span data-i18n="portal"></span><small data-i18n="lema"></small></h1>
      <div class="ferramentas">
        <button class="manual" id="ver-stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg><span data-i18n="stats_curto"></span></button>
        <button class="manual" id="ver-normas-inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h5"/></svg><span data-i18n="normas"></span></button>
      </div>
    </div>
    <div class="bandeiras" id="bandeiras" role="group" style="margin:-4px 0 10px"></div>
    <div class="filtro-xogos"><button id="filtro-xog" class="filtro"></button><button id="filtro-tipo" class="filtro"></button></div>
    <div class="xogos" id="xogos" role="group"></div>
    <p class="desc-xogo" id="desc-xogo"></p>
    <div class="mais-xogos oculto" id="mais-xogos"></div>
    <div class="seg" id="modo" role="group"><button aria-pressed="true" data-v="local" data-i18n="modo_local"></button><button aria-pressed="false" data-v="online" data-i18n="modo_online"></button></div>
    <div id="erro-inicio" class="erro oculto"></div>

    <div class="liña1"><input type="text" id="nome" maxlength="18">
    <div class="aparencia">
      <button id="skin-btn" class="sel-ap" data-panel="cartas"><span class="et" data-i18n="cartas"></span><span class="mostra-ap" id="mostra-cartas"></span></button>
      <button id="rev-btn" class="sel-ap" data-panel="reverso"><span class="et" data-i18n="reverso"></span><span class="mostra-ap" id="mostra-reverso"></span></button>
      <button id="tap-btn" class="sel-ap" data-panel="tapete"><span class="et" data-i18n="tapete"></span><span class="mostra-ap" id="mostra-tapete"></span></button>
    </div></div>
    <div id="skin-panel" class="oculto"></div>

    <div class="bloque oculto" id="bloque-online">
      <div class="fila"><span data-i18n="codigo"></span><input type="text" id="codigo" maxlength="6" autocapitalize="characters"></div>
      <p id="nota-online" style="font-size:12px;color:var(--tinta-2);margin:4px 0 0"></p>
      <input type="hidden" id="sb-url"><input type="hidden" id="sb-chave"><input type="hidden" id="servidor">
    </div>

    <div class="opcions" id="ciclos"></div>
    <div class="chips">
      <button class="chip tx" role="switch" aria-checked="true" data-regra="sinais"><span data-i18n="sinais"></span></button>
      <button class="chip tx" role="switch" aria-checked="true" data-regra="ordago"><span data-i18n="ordago"></span></button>
      <button class="chip tx" role="switch" aria-checked="true" id="sw-sons"><span data-i18n="sons"></span></button>
      <button class="chip tx" role="switch" aria-checked="false" id="sw-musica"><span data-i18n="musica"></span></button>

<script>
/* Motor de mus — función pura: aplicar(estado, accion) -> { estado, eventos }
   Sen UI nin rede. Funciona en Node (module.exports) e no navegador (window.Mus). */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory();
  else root.Mus = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const PAUS = ['oros', 'copas', 'espadas', 'bastos'];
  const NUMEROS = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];
  const LANCES = ['grande', 'pequena', 'pares', 'xogo'];
  const PARELLA = [0, 1, 0, 1]; // asento -> parella (0 = A: asentos 0 e 2; 1 = B: asentos 1 e 3)

  const REGRAS_DEFECTO = {
    reis: 8,          // 8: o 3 vale rei e o 2 vale as; 4: baraja normal
    meta: 40,         // pedras para gañar a partida
    vacas: 1,         // partidas que fan o xogo
    sinais: true,
    verSinal: 0.3,
    descarte: 'libre', // libre (1..4) | limitado (1..3)
    ordago: true,
    tempoTurno: 30
  };

  // ---------- utilidades ----------
  function clon(x) { return JSON.parse(JSON.stringify(x)); }

  function rng(estado) {
    // xerador determinista (mulberry32) para que as partidas sexan reproducibles nos tests
    let a = estado.semente >>> 0;
    a = (a + 0x6D2B79F5) >>> 0;
    estado.semente = a;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function barallar(estado, cartas) {
    const c = cartas.slice();
    for (let i = c.length - 1; i > 0; i--) {
      const j = Math.floor(rng(estado) * (i + 1));
      [c[i], c[j]] = [c[j], c[i]];
    }
    return c;
  }

  function crearBaraja() {
    const b = [];
    for (const pau of PAUS) for (const numero of NUMEROS) b.push({ pau, numero });
    return b;
  }

  // valor para o xogo (suma) e rango para grande/pequena/pares
  function rango(carta, regras) {
    let n = carta.numero;
    if (regras.reis === 8) { if (n === 3) n = 12; if (n === 2) n = 1; }
    return n; // 1,4,5,6,7,10,11,12 (con 8 reis); 1..7,10,11,12 (con 4 reis)
  }
  function valor(carta, regras) {
    const r = rango(carta, regras);
    return r >= 10 ? 10 : r;
  }

  // ---------- avaliación de mans ----------
  function rangosOrdenados(man, regras, desc) {
    const r = man.map(c => rango(c, regras)).sort((a, b) => a - b);
    return desc ? r.reverse() : r;
  }
  function compararListas(a, b) {
    for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) return a[i] > b[i] ? 1 : -1; }
    return 0;
  }
  // > 0 se a gaña a b en grande
  function compararGrande(a, b, regras) {
    return compararListas(rangosOrdenados(a, regras, true), rangosOrdenados(b, regras, true));
  }
  // > 0 se a gaña a b en pequena (cartas máis baixas)
  function compararPequena(a, b, regras) {
    return -compararListas(rangosOrdenados(a, regras, false), rangosOrdenados(b, regras, false));
  }
  // pares: {tipo: 0 nada, 1 par, 2 medias, 3 duples, altos:[...]}
  function pares(man, regras) {
    const cont = {};
    for (const c of man) { const r = rango(c, regras); cont[r] = (cont[r] || 0) + 1; }
    const grupos = Object.entries(cont).map(([r, n]) => [Number(r), n]).sort((x, y) => y[0] - x[0]);
    const cuatro = grupos.find(g => g[1] === 4);
    if (cuatro) return { tipo: 3, altos: [cuatro[0], cuatro[0]] };
    const tres = grupos.find(g => g[1] === 3);
    const dous = grupos.filter(g => g[1] === 2).map(g => g[0]);
    if (dous.length === 2) return { tipo: 3, altos: dous };
    if (tres) return { tipo: 2, altos: [tres[0]] };
    if (dous.length === 1) return { tipo: 1, altos: dous };
    return { tipo: 0, altos: [] };
  }
  function compararPares(a, b, regras) {
    const pa = pares(a, regras), pb = pares(b, regras);
    if (pa.tipo !== pb.tipo) return pa.tipo > pb.tipo ? 1 : -1;
    return compararListas(pa.altos, pb.altos);
  }
  function valorPares(man, regras) { return pares(man, regras).tipo; } // 1, 2 ou 3 pedras

  function sumaXogo(man, regras) { return man.reduce((s, c) => s + valor(c, regras), 0); }
  function tenXogo(man, regras) { return sumaXogo(man, regras) >= 31; }
  const ORDE_XOGO = [31, 32, 40, 37, 36, 35, 34, 33];
  function forzaXogo(s) { const i = ORDE_XOGO.indexOf(s); return i < 0 ? -1 : ORDE_XOGO.length - i; }
  function compararXogo(a, b, regras) {
    const fa = forzaXogo(sumaXogo(a, regras)), fb = forzaXogo(sumaXogo(b, regras));
    return fa === fb ? 0 : (fa > fb ? 1 : -1);
  }
  function valorXogo(man, regras) { return sumaXogo(man, regras) === 31 ? 3 : 2; }
  function compararPunto(a, b, regras) {
    const sa = sumaXogo(a, regras), sb = sumaXogo(b, regras);
    return sa === sb ? 0 : (sa > sb ? 1 : -1);
  }

  const COMPARADORES = { grande: compararGrande, pequena: compararPequena, pares: compararPares, xogo: compararXogo, punto: compararPunto };

  // ---------- orde de turno ----------
  function ordeDesdeMan(estado) { return [0, 1, 2, 3].map(i => (estado.man + i) % 4); }
  function primeiroDesdeMan(estado, asentos) {
    for (const a of ordeDesdeMan(estado)) if (asentos.includes(a)) return a;
    return null;
  }

  // ---------- creación ----------
  function crearEstado(regras, asentos, semente) {
    regras = Object.assign({}, REGRAS_DEFECTO, regras || {});
    const estado = {
      regras,
      asentos: (asentos || ['Xogador 1', 'Bot 2', 'Bot 3', 'Bot 4']).map((a, i) =>
        typeof a === 'string' ? { nome: a, bot: i !== 0 } : Object.assign({ nome: 'Asento ' + (i + 1), bot: false }, a)),
      semente: (semente === undefined ? Date.now() : semente) >>> 0,
      man: 0,
      marcador: [0, 0],
      vacas: [0, 0],
      numMan: 0,
      fase: 'fin',
      log: [],
      gañador: null,
      partidaGañada: null
    };
    return novaMan(estado, true);
  }

  function novaMan(estado, primeira) {
    if (!primeira) { estado.man = (estado.man + 1) % 4; }
    estado.numMan += 1;
    const mazo = barallar(estado, crearBaraja());
    estado.mazo = mazo;
    estado.descartes = [];
    estado.cartas = [[], [], [], []];
    for (let k = 0; k < 4; k++) for (const a of ordeDesdeMan(estado)) estado.cartas[a].push(estado.mazo.pop());
    estado.fase = 'mus';
    estado.mus = { ditos: [], ronda: 1 };
    estado.descartesPendentes = null;
    estado.turno = estado.man;
    estado.lance = null;
    estado.lances = {}; // resultados por lance
    estado.declaracions = { pares: [null, null, null, null], xogo: [null, null, null, null] };
    estado.destapadas = false;
    estado.sinais = [];
    estado.log.push({ t: 'man', numMan: estado.numMan, man: estado.man });
    return estado;
  }

  // ---------- accións posibles ----------
  function accionsPosibles(estado, asento) {
    if (estado.fase === 'fin') return [];
    const acc = [];
    if (estado.fase === 'mus') {
      if (estado.turno === asento) acc.push({ tipo: 'MUS' }, { tipo: 'NON_MUS' });
    } else if (estado.fase === 'descarte') {
      if (estado.descartesPendentes.includes(asento)) acc.push({ tipo: 'DESCARTAR', cartas: '[índices 0..3]' });
    } else if (estado.fase === 'declarar') {
      if (estado.turno === asento) acc.push({ tipo: 'DECLARAR' });
    } else if (LANCES.includes(estado.fase) || estado.fase === 'punto') {
      const l = estado.lance;
      if (l && l.turno === asento) {
        if (!l.envite) {
          acc.push({ tipo: 'PASAR' }, { tipo: 'ENVIDAR', cantidade: 2 });
          if (estado.regras.ordago) acc.push({ tipo: 'ORDAGO' });
        } else {
          acc.push({ tipo: 'QUERO' }, { tipo: 'NON_QUERO' });
          if (!l.envite.ordago) {
            acc.push({ tipo: 'ENVIDAR', cantidade: l.envite.cantidade + 2 });
            if (estado.regras.ordago) acc.push({ tipo: 'ORDAGO' });
          }
        }
      }
    }
    if (estado.regras.sinais && estado.fase !== 'fin' && estado.fase !== 'conta') acc.push({ tipo: 'SINAL', sinal: '[dous-reis|dous-ases|medias|duples|31|cego]' });
    return acc;
  }

  // ---------- aplicar ----------
  function aplicar(estadoIn, accion) {
    const estado = clon(estadoIn);
    const eventos = [];
    const asento = accion.asento;
    const fallo = msg => { throw new Error(msg); };
    if (estado.fase === 'fin') fallo('A partida rematou');

    switch (accion.tipo) {
      case 'SINAL': {
        if (!estado.regras.sinais) fallo('Sinais prohibidas nesta mesa');
        // quen a ve: a parella sempre; cada rival coa probabilidade regras.verSinal
        const vistoPor = [];
        for (let a = 0; a < 4; a++) {
          if (a === asento) continue;
          if (PARELLA[a] === PARELLA[asento] || rng(estado) < (estado.regras.verSinal || 0)) vistoPor.push(a);
        }
        estado.sinais.push({ asento, sinal: accion.sinal, numMan: estado.numMan, ronda: estado.mus ? estado.mus.ronda : 0, vistoPor });
        eventos.push({ t: 'sinal', asento, sinal: accion.sinal, parella: PARELLA[asento], vistoPor });
        return { estado, eventos };
      }
      case 'MUS':
      case 'NON_MUS': {
        if (estado.fase !== 'mus' || estado.turno !== asento) fallo('Non é o teu turno de mus');
        eventos.push({ t: accion.tipo, asento });
        estado.log.push({ t: accion.tipo, asento });
        if (accion.tipo === 'NON_MUS') {
          iniciarLance(estado, 'grande', eventos);
        } else {
          estado.mus.ditos.push(asento);
          if (estado.mus.ditos.length === 4) {
            estado.fase = 'descarte';
            estado.descartesPendentes = [0, 1, 2, 3];
            estado.descartesFeitos = [null, null, null, null];
            estado.turno = null;
            eventos.push({ t: 'descarte' });
          } else {
            estado.turno = (asento + 1) % 4;
          }
        }
        return { estado, eventos };
      }
      case 'DESCARTAR': {
        if (estado.fase !== 'descarte' || !estado.descartesPendentes.includes(asento)) fallo('Non toca descartar');
        const idx = Array.from(new Set(accion.cartas || [])).filter(i => i >= 0 && i < 4).sort((a, b) => b - a);
        const max = estado.regras.descarte === 'limitado' ? 3 : 4;
        if (idx.length < 1 || idx.length > max) fallo('Hai que descartar entre 1 e ' + max + ' cartas');
        estado.descartesFeitos[asento] = idx.length;
        estado.descartesPendentes = estado.descartesPendentes.filter(a => a !== asento);
        estado.cartas[asento] = estado.cartas[asento].filter((_, i) => !idx.includes(i));
        // gardamos as descartadas por asento e repoñemos cando todos descartaron
        estado.descartesPorAsento = estado.descartesPorAsento || [[], [], [], []];
        estado.descartesPorAsento[asento] = idx.map(i => estadoIn.cartas[asento][i]);
        eventos.push({ t: 'descartou', asento, n: idx.length });
        if (estado.descartesPendentes.length === 0) {
          for (const a of ordeDesdeMan(estado)) {
            while (estado.cartas[a].length < 4) {
              if (estado.mazo.length === 0) {
                estado.mazo = barallar(estado, estado.descartes);
                estado.descartes = [];
                eventos.push({ t: 'rebarallar' });
              }
              estado.cartas[a].push(estado.mazo.pop());
            }
          }
          for (let a = 0; a < 4; a++) estado.descartes.push(...estado.descartesPorAsento[a]);
          estado.descartesPorAsento = null;
          estado.fase = 'mus';
          estado.mus = { ditos: [], ronda: estado.mus.ronda + 1 };
          estado.turno = estado.man;
          eventos.push({ t: 'novaRoldaMus', ronda: estado.mus.ronda });
        }
        return { estado, eventos };
      }
      case 'DECLARAR': {
        if (estado.fase !== 'declarar' || estado.turno !== asento) fallo('Non toca declarar');
        const lance = estado.lancePendente;
        const ten = lance === 'pares' ? pares(estado.cartas[asento], estado.regras).tipo > 0 : tenXogo(estado.cartas[asento], estado.regras);
        estado.declaracions[lance][asento] = ten;
        eventos.push({ t: 'declarou', asento, lance, ten });
        estado.log.push({ t: 'declarou', asento, lance, ten });
        const seguinte = ordeDesdeMan(estado).find(a => estado.declaracions[lance][a] === null);
        if (seguinte !== undefined) { estado.turno = seguinte; }
        else { resolverDeclaracions(estado, lance, eventos); }
        return { estado, eventos };
      }
      case 'PASAR':
      case 'ENVIDAR':
      case 'ORDAGO':
      case 'QUERO':
      case 'NON_QUERO': {
        const r = aplicarAposta(estado, accion, eventos);
        if (r.estado.lance) r.estado.turno = r.estado.lance.turno;
        return r;
      }
      default:
        fallo('Acción descoñecida: ' + accion.tipo);
    }
  }

  // ---------- lances ----------
  function participantes(estado, lance) {
    if (lance === 'pares' || lance === 'xogo') return [0, 1, 2, 3].filter(a => estado.declaracions[lance][a]);
    return [0, 1, 2, 3];
  }

  function iniciarLance(estado, lance, eventos) {
    if (lance === 'conta') return conta(estado, eventos);
    if (lance === 'pares' || lance === 'xogo') {
      // primeiro declaran en orde
      estado.fase = 'declarar';
      estado.lancePendente = lance;
      estado.turno = estado.man;
      estado.lance = null;
      eventos.push({ t: 'declarar', lance });
      return;
    }
    const part = participantes(estado, lance);
    abrirApostas(estado, lance, part, eventos);
  }

  function resolverDeclaracions(estado, lance, eventos) {
    const part = participantes(estado, lance);
    const parellas = new Set(part.map(a => PARELLA[a]));
    if (parellas.size === 2) {
      abrirApostas(estado, lance, part, eventos);
    } else if (parellas.size === 1) {

      l.ultimoAceptado = l.envite.cantidade;

    estado.fase = 'conta';
    return { estado, eventos };
  }

    const g = estado.partidaGañada;

      gañador: estado.gañador,
      partidaGañada: estado.partidaGañada,
      novaPartida: !!estado.novaPartida,
      cartas: estado.cartas.map((m, i) => (i === asento || estado.destapadas) ? m : m.map(() => null)),
      log: estado.log.slice(-40),
      sinais: (estado.sinais || []).filter(x => x.asento === asento || x.vistoPor.includes(asento)).map(x => ({ asento: x.asento, sinal: x.sinal, parella: PARELLA[x.asento] })),

    };
    if (asento !== null) v.avaliacion = avaliar(estado.cartas[asento], estado.regras);

  }

  function avaliar(man, regras) {
    return {
      grande: rangosOrdenados(man, regras, true),
      pequena: rangosOrdenados(man, regras, false),
      pares: pares(man, regras),
      suma: sumaXogo(man, regras),
      xogo: tenXogo(man, regras)

    PAUS, NUMEROS, LANCES, PARELLA, REGRAS_DEFECTO,
    crearEstado, aplicar, accionsPosibles, vistaPara, seguinteMan,
    rango, valor, pares, sumaXogo, tenXogo, avaliar,
    compararGrande, compararPequena, compararPares, compararXogo, compararPunto,
    crearBaraja

});

    function cantesPosibles(e, asento) {

        semente: (semente === undefined ? Date.now() : semente) >>> 0, man: 0, numMan: 0, log: [], gañador: null, marcador: [0] };
      return novaMan(e);
    }
    function novaMan(e) {
      e.numMan++;

    function cabeEnFund(e, c) { const f = e.fundacions[c.pau]; return f.length === 0 ? O(c) === 0 : O(c) === O(f[f.length - 1]) + 1; }
    function cabeEnCol(e, c, j) { const t = topo(e.columnas[j]); if (!t) return O(c) === 9; return t.boca && O(c) === O(t.c) - 1 && c.pau !== t.c.pau; }
    function secuenciaValida(col, k) { // desde k ata o final: todas boca arriba e ben encadeadas

        if (!e.mazo.length) { if (!e.descarte.length) throw new Error('Non quedan cartas'); e.mazo = e.descarte.reverse(); e.descarte = []; e.voltas++; ev.push({ t: 'volta' }); return { estado: e, eventos: ev }; }
        for (let k = 0; k < e.regras.roubar && e.mazo.length; k++) e.descarte.push(e.mazo.pop());

      if (ac.tipo === 'RENDERSE') return pechar(e, ev, false);

      let cartas, quitar;

      if (dt === 'fund') { if (cartas.length !== 1 || !cabeEnFund(e, cartas[0])) throw new Error('Non cabe na fundación'); quitar(); e.fundacions[cartas[0].pau].push(cartas[0]); }

      e.movementos++; destapar(e);

    function pechar(e, ev, gaña) {

    function seguinteMan(eIn) { const e = clon(eIn); if (e.fase !== 'conta' && e.fase !== 'fin') throw new Error('Aínda se está xogando'); return novaMan(e); }
    // movemento automático: a mellor xogada simple que hai (para a axuda e para os tests)
    function suxestion(e) {

      for (const [de, c] of tops) if (c && cabeEnFund(e, c)) return { tipo: 'MOVER', de, ate: 'fund' };
      for (let i = 0; i < 7; i++) { const col = e.columnas[i]; const k = col.findIndex(x => x.boca); if (k < 0) continue; if (k === 0 && O(col[0].c) === 9) continue;
        for (let j = 0; j < 7; j++) if (j !== i && cabeEnCol(e, col[k].c, j)) return { tipo: 'MOVER', de: 'col:' + i + ':' + k, ate: 'col:' + j }; }

        fundacions: Object.fromEntries(PAUS.map(p => [p, e.fundacions[p].length ? e.fundacions[p][e.fundacions[p].length - 1] : null])),

    }

    return { nome: 'solitario', crearEstado, aplicar, accionsPosibles, vistaPara, seguinteMan, decidir, suxestion, REGRAS_DEFECTO };
  })();

  return { SeteMedia, Cinquillo, Mentiroso, Burro, Trinta, Solitario };
});

    normas_escoba: "<h2>Normas da escoba</h2><p>De dous a catro xogadores (a catro, por parellas). Valores: do as ao sete o seu número, sota 8, cabalo 9, rei 10.</p><h3>Xogo</h3><p>Repártense tres cartas a cada un e catro boca arriba na mesa. Na túa quenda botas unha carta: se con cartas da mesa suma <b>15</b>, lévalas; se non, queda na mesa. Se levas todas as da mesa fas <b>escoba</b>. Cando se acaban as mans, repártense outras tres ata acabar o mazo; o que quede na mesa lévao quen recolleu por última vez.</p><h3>Conta</h3><p>Un punto por cada escoba, por ter máis cartas, máis ouros, máis setes e polo sete de ouros (o velo). Gaña quen chega primeiro á meta.</p>",
    normas_chinchon: "<h2>Normas do chinchón</h2><p>De dous a catro xogadores, sete cartas cada un. As figuras valen 10 e o resto o seu número.</p><h3>Xogadas</h3><p><b>Tríos e cuartetos</b> do mesmo número e <b>escaleiras</b> de tres ou máis cartas seguidas do mesmo pau (o 7 vai seguido da sota).</p><h3>Quenda</h3><p>Roubas do mazo ou da carta de enriba do descarte e despois botas unha. Se tras botar as túas cartas soltas suman 5 ou menos, podes <b>pechar</b>: todos suman os puntos das súas cartas soltas. Quen pecha sen soltas resta 10, e quen pecha cunha escaleira de sete gaña a partida: iso é o <b>chinchón</b>.</p><h3>Final</h3><p>Quen pasa do límite queda fóra; gaña o último que queda.</p>",
    normas_tutecabron: "<h2>Normas do tute cabrón</h2><p>O tute de sempre pero cada un por si, a tres ou a catro (a tres quítase o 2 de ouros e repártense trece cartas).</p><h3>Xogo</h3><p>As mesmas obrigas ca no tute: asistir, montar e fallar se se pode. Quen gaña unha baza pode cantar 20 ou 40, e o tute (catro reis ou catro cabalos) gaña a man. A última baza vale 10.</p><h3>Conta</h3><p>Leva a man quen fai máis puntos; o resto, cabróns.</p>",
    normas_subastado: "<h2>Normas do tute subastado</h2><p>Catro xogadores, dez cartas cada un e sen triunfo á vista.</p><h3>Poxa</h3><p>Desde o man, cada un poxa os puntos que se compromete a facer (desde 60, de cinco en cinco) ou pasa e xa non volve entrar. Quen queda coa poxa elixe a <b>pinta</b> (o triunfo) e xoga só contra os outros tres, que van xuntos.</p><h3>Xogo</h3><p>Obrigas do tute: asistir, montar e fallar. Cantes de 20 e 40 e dez de últimas.</p><h3>Conta</h3><p>Se quen poxou chega aos puntos, apunta dúas marcas; se non, os outros apuntan unha cada un. Gaña quen chega primeiro á meta.</p>",
    normas_pocha: "<h2>Normas da pocha</h2><p>Catro xogadores. Cada ronda repártese unha carta máis (1, 2, 3… ata 10 e, na partida longa, volta a baixar). A carta seguinte do mazo, ou a última do que reparte, marca o triunfo.</p><h3>Apostas</h3><p>Antes de xogar, cada un di cantas bazas vai facer. O último non pode apostar un número que faga que a suma cadre coas bazas da ronda.</p><h3>Xogo</h3><p>Hai que asistir, montar e fallar se se pode.</p><h3>Conta</h3><p>Se fas exactamente o apostado, sumas 10 máis 5 por baza; se non, restas 5 por cada baza de diferenza. Gaña quen remata con máis puntos.</p>",
    normas_cuadrado: "<h2>Normas do cuadrado</h2><p>Catro xogadores por parellas. Cada un ten catro cartas e hai catro boca arriba na mesa. O obxectivo é xuntar <b>catro iguais</b> (catro reis, catro cincos…).</p><h3>Quenda</h3><p>Nesta versión por quendas, cada un troca unha carta da man cunha da mesa ou pasa. Se pasan os catro seguidos, a mesa renóvase con catro cartas do mazo.</p><h3>Sinais e cantos</h3><p>Quen ten catro iguais non o pode dicir: faille <b>sinal</b> á parella, e é a parella quen canta <b>Cuadrado!</b> Os rivais poden pillar a sinal e <b>cortar</b> a quen a fixo. Acertar dá un punto; equivocarse dállo á outra parella.</p>",

    ultimas: "Dez de últimas para {p}",
    normas_brisca: "<h2>Normas da brisca</h2><p>Xógase a dous ou a catro (por parellas, compañeiros enfrontados) coa baralla de 40. Repártense 3 cartas a cada un e vólvese unha carta: o seu pau é o <b>triunfo</b> e queda debaixo do mazo.</p><h3>Valores</h3><p>As 11, tres 10, rei 4, cabalo 3, sota 2; o resto non suma. En total hai 120 puntos. Orde de forza: as, tres, rei, cabalo, sota, 7, 6, 5, 4, 2.</p><h3>Xogo</h3><p>Sae o man e cada un bota unha carta, sen obriga de asistir nin de matar. Leva a baza a carta máis alta do pau de saída, salvo que haxa triunfo: entón gaña o triunfo máis alto. Despois de cada baza, rouban un por un empezando por quen a levou, que sae na seguinte. A última carta en roubarse é a mostra.</p><h3>Cambiar a mostra</h3><p>Quen teña o 7 de triunfo pode cambialo pola mostra se esta é unha figura, o tres ou o as; se a mostra é baixa, cámbiase co 2. Só antes de botar carta e mentres quede mazo.</p><h3>Conta</h3><p>Gaña a man quen pasa de 60 puntos. Nun empate a 60 leva a man quen fixo a última baza.</p>",
    normas_tute: "<h2>Normas do tute</h2><p>Catro xogadores por parellas, compañeiros enfrontados. Repártense as 40 cartas, dez a cada un; a última do que reparte marca o <b>triunfo</b>.</p><h3>Valores</h3><p>Como na brisca: as 11, tres 10, rei 4, cabalo 3, sota 2. A última baza vale 10 máis (<b>dez de últimas</b>): en total 130.</p><h3>Obrigas</h3><p>Hai que <b>asistir</b> ao pau de saída e <b>montar</b> (superar a carta que vai gañando) se se pode. Sen cartas do pau hai que <b>fallar</b> con triunfo, e se xa hai triunfo na mesa, montalo se se pode; se non, bótase calquera carta. Coa opción <i>Montar: parella</i>, cando vai gañando o compañeiro non hai obriga de montar nin de fallar.</p><h3>Cantes</h3><p>Quen gaña unha baza pode cantar, antes de saír, rei e cabalo do mesmo pau: <b>20</b>, ou <b>40</b> se son de triunfo. Un cante por baza. Catro reis ou catro cabalos son <b>tute</b> e gañan a man ao momento.</p><h3>Conta</h3><p>Gaña a man a parella con máis puntos (bazas + cantes + dez de últimas).</p>",

    normas_texto: "<h2>Normas do mus</h2>\n<p>Xogan dúas parellas enfrontadas con baralla española de 40 cartas. Gaña a parella que chega antes a 40 pedras (8 amarracos). Con <b>8 reis</b>, os 3 valen como reis e os 2 como ases.</p>\n<h3>Valores</h3><p>Rei, cabalo e sota valen 10 para o xogo; o as vale 1; as demais o seu número. Orde de maior a menor: rei, cabalo, sota, 7, 6, 5, 4, as.</p>\n<h3>A man</h3><p>Repártense 4 cartas. Empezando polo man, cada un di <b>mus</b> ou <b>non hai mus</b>. Se os catro dan mus, cada un cambia as cartas que queira e volve preguntarse. O primeiro \"non hai mus\" corta.</p>\n<h3>Os lances</h3><p><b>Grande</b>: as cartas máis altas. <b>Pequena</b>: as máis baixas. <b>Pares</b>: duples (dúas parellas ou catro iguais), medias (tres iguais) ou par; só apostan os que teñen pares. <b>Xogo</b>: suma de 31 ou máis; 31 é o mellor, despois 32, 40, 37, 36, 35, 34, 33; só apostan os que teñen xogo. Se ninguén ten xogo, xógase o <b>punto</b>: a suma máis próxima a 30. En calquera empate gaña quen estea máis preto do man.</p>\n<h3>Apostas</h3><p>En cada lance, desde o man, cada un pasa ou envida. <b>Envido</b> son 2 pedras; pódese envidar máis ou botar <b>órdago</b> (toda a partida). A parella contraria responde <b>quero</b>, <b>non quero</b> ou sobe. Se os dous rivais non queren, quen envidou apunta xa 1 pedra (ou o último envite aceptado se rexeitan unha subida). Un órdago aceptado destapa as cartas e decide a partida nese lance.</p>\n<h3>Conta</h3><p>Ao rematar as apostas, destápanse as cartas e cóntase na orde grande, pequena, pares, xogo ou punto. Lance en paso: 1 pedra. Envite aceptado: o envidado. Pares, por cada xogador da parella gañadora: par 1, medias 2, duples 3. Xogo: 31 vale 3, outro xogo 2. Se só unha parella ten pares ou xogo, lévao sen apostar. A conta párase en canto unha parella chega á meta.</p>\n<h3>Sinais</h3><p>As parellas fanse sinais para contarse as cartas sen falar. Na app fanse desde a fileira de caras; a túa parella sempre as ve e o rival pode pillalas.</p>",

    normas_solitario: "<h2>Normas del solitario</h2><p>Para jugar solo. Se reparten siete columnas (de una a siete cartas, solo la última boca arriba) y el resto queda en el montón.</p><h3>Objetivo</h3><p>Llevar las 40 cartas a las cuatro <b>fundaciones</b>, una por palo, en orden del as al rey (as, 2, 3… 7, sota, caballo, rey).</p><h3>Columnas</h3><p>En las columnas se baja de una en una (rey, caballo, sota, 7, 6…) <b>alternando palo</b>: nunca dos del mismo palo seguidas. Puedes mover escaleras enteras. En un hueco solo se puede poner un rey. Al quedar descubierta una carta tapada, se vuelve.</p><h3>Montón</h3><p>Toca el montón para sacar cartas al descarte (una o tres, según la opción). Cuando se acaba, se vuelve a empezar.</p><h3>En la app</h3><p>Toca una carta para cogerla y después el sitio donde va. Tocar dos veces una carta intenta subirla a la fundación. «Subir» lleva a la fundación todo lo que se puede.</p>",

    normas_julepe: "<h2>Normas del julepe</h2><p>De tres a seis jugadores con fichas. En cada mano todos ponen una ficha en el bote, se reparten cinco cartas y se vuelve la siguiente: marca el triunfo.</p><h3>Entrar</h3><p>Desde el mano, cada uno decide si <b>entra</b> o pasa. Si solo entra uno, quien reparte está obligado a jugar contra él. Si nadie entra, el bote queda para la siguiente mano.</p><h3>Juego</h3><p>Juegan solo los que entraron, con las obligaciones del tute: asistir, montar y fallar si se puede.</p><h3>Cuenta</h3><p>Cada baza cobra la quinta parte del bote. Quien entró e hizo menos de dos bazas lleva <b>julepe</b>: paga al bote tanto como había. Gana quien acaba con más fichas.</p>",

    normas_sieteymedia: "<h2>Normas de la siete y media</h2><p>De dos a cuatro jugadores; la banca rota en cada mano. Del as al siete valen su número y las figuras, medio punto.</p><h3>Juego</h3><p>Cada uno recibe una carta tapada. En tu turno pides cartas, que salen descubiertas, hasta que te plantas; si pasas de siete y media, te pasas y pierdes. Al final juega la banca.</p><h3>Cuenta</h3><p>Ganas una ficha si tienes más que la banca sin pasarte (dos si haces siete y media con dos cartas); en los empates gana la banca. Tras las vueltas acordadas gana quien tiene más fichas.</p>",
    normas_cinquillo: "<h2>Normas del cinquillo</h2><p>Se reparte toda la baraja. Sale quien tiene el <b>5 de oros</b>.</p><h3>Juego</h3><p>En tu turno colocas una carta: un cinco de otro palo (abre una fila nueva) o la carta siguiente o anterior de una fila ya abierta del mismo palo (el 7 va seguido de la sota). Si no tienes ninguna que encaje, pasas.</p><h3>Final</h3><p>Gana quien se queda antes sin cartas.</p>",
    normas_trintaeunha: "<h2>Normas de la treinta y una</h2><p>Tres cartas cada uno y una boca arriba en el descarte. El as vale 11, las figuras 10 y el resto su número. Solo suman las cartas del mismo palo.</p><h3>Juego</h3><p>En tu turno robas del mazo o del descarte y echas una carta. Si crees que tienes buena mano, en vez de robar puedes <b>llamar</b>: los demás juegan un turno más y se destapa.</p><h3>Cuenta</h3><p>Quien tiene la suma más baja pierde una vida. Quien hace <b>31</b> destapa al momento y pierden todos los demás. Quien se queda sin vidas sale; gana el último.</p>",
    normas_mentiroso: "<h2>Normas del mentiroso</h2><p>Se reparte toda la baraja. Gana quien se queda antes sin cartas.</p><h3>Juego</h3><p>Quien sale echa de una a tres cartas boca abajo y dice un número (por ejemplo, «reyes»). Los siguientes echan también de una a tres diciendo que son de ese número, sea verdad o no.</p><h3>¡Mentiroso!</h3><p>Antes de echar, puedes acusar al anterior. Se destapan sus cartas: si mentía, se lleva toda la pila; si decía la verdad, te la llevas tú. Quien echa la última carta y no lo pillan, gana.</p>",
    normas_burro: "<h2>Normas del burro</h2><p>Se quita una carta de la baraja sin mirarla y se reparte el resto. Cada uno echa las parejas (dos cartas del mismo número) que tenga.</p><h3>Juego</h3><p>En tu turno coges una carta a ciegas de la mano del siguiente. Si hace pareja, la echas. Quien se queda sin cartas, sale.</p><h3>Final</h3><p>Quien se queda con la última carta sin pareja es el <b>burro</b> y se lleva una letra. Quien completa B-U-R-R-O pierde la partida.</p>",

    normas_escoba: "<h2>Normas de la escoba</h2><p>De dos a cuatro jugadores (a cuatro, por parejas). Valores: del as al siete su número, sota 8, caballo 9, rey 10.</p><h3>Juego</h3><p>Se reparten tres cartas a cada uno y cuatro boca arriba en la mesa. En tu turno echas una carta: si con cartas de la mesa suma <b>15</b>, te las llevas; si no, se queda en la mesa. Si te llevas todas las de la mesa haces <b>escoba</b>. Cuando se acaban las manos se reparten otras tres hasta acabar el mazo; lo que quede en la mesa se lo lleva quien recogió por última vez.</p><h3>Cuenta</h3><p>Un punto por cada escoba, por tener más cartas, más oros, más sietes y por el siete de oros (el velo). Gana quien llega antes a la meta.</p>",
    normas_chinchon: "<h2>Normas del chinchón</h2><p>De dos a cuatro jugadores, siete cartas cada uno. Las figuras valen 10 y el resto su número.</p><h3>Jugadas</h3><p><b>Tríos y cuartetos</b> del mismo número y <b>escaleras</b> de tres o más cartas seguidas del mismo palo (el 7 va seguido de la sota).</p><h3>Turno</h3><p>Robas del mazo o la carta de arriba del descarte y después echas una. Si tras echar tus cartas sueltas suman 5 o menos, puedes <b>cerrar</b>: todos suman los puntos de sus cartas sueltas. Quien cierra sin sueltas resta 10, y quien cierra con una escalera de siete gana la partida: eso es el <b>chinchón</b>.</p><h3>Final</h3><p>Quien pasa del límite queda fuera; gana el último que queda.</p>",
    normas_tutecabron: "<h2>Normas del tute cabrón</h2><p>El tute de siempre pero cada uno a lo suyo, a tres o a cuatro (a tres se quita el 2 de oros y se reparten trece cartas).</p><h3>Juego</h3><p>Las mismas obligaciones que en el tute: asistir, montar y fallar si se puede. Quien gana una baza puede cantar 20 o 40, y el tute (cuatro reyes o cuatro caballos) gana la mano. La última baza vale 10.</p><h3>Cuenta</h3><p>Se lleva la mano quien hace más puntos; el resto, cabrones.</p>",
    normas_subastado: "<h2>Normas del tute subastado</h2><p>Cuatro jugadores, diez cartas cada uno y sin triunfo a la vista.</p><h3>Subasta</h3><p>Desde el mano, cada uno puja los puntos que se compromete a hacer (desde 60, de cinco en cinco) o pasa y ya no vuelve a entrar. Quien se queda la subasta elige la <b>pinta</b> (el triunfo) y juega solo contra los otros tres, que van juntos.</p><h3>Juego</h3><p>Obligaciones del tute: asistir, montar y fallar. Cantes de 20 y 40 y diez de últimas.</p><h3>Cuenta</h3><p>Si quien pujó llega a los puntos, se apunta dos marcas; si no, los demás se apuntan una cada uno. Gana quien llega antes a la meta.</p>",
    normas_pocha: "<h2>Normas de la pocha</h2><p>Cuatro jugadores. Cada ronda se reparte una carta más (1, 2, 3… hasta 10 y, en la partida larga, vuelve a bajar). La siguiente carta del mazo, o la última del que reparte, marca el triunfo.</p><h3>Apuestas</h3><p>Antes de jugar, cada uno dice cuántas bazas va a hacer. El último no puede apostar un número que haga que la suma cuadre con las bazas de la ronda.</p><h3>Juego</h3><p>Hay que asistir, montar y fallar si se puede.</p><h3>Cuenta</h3><p>Si haces exactamente lo apostado, sumas 10 más 5 por baza; si no, restas 5 por cada baza de diferencia. Gana quien acaba con más puntos.</p>",
    normas_cuadrado: "<h2>Normas del cuadrado</h2><p>Cuatro jugadores por parejas. Cada uno tiene cuatro cartas y hay cuatro boca arriba en la mesa. El objetivo es juntar <b>cuatro iguales</b> (cuatro reyes, cuatro cincos…).</p><h3>Turno</h3><p>En esta versión por turnos, cada uno cambia una carta de la mano por una de la mesa o pasa. Si pasan los cuatro seguidos, la mesa se renueva con cuatro cartas del mazo.</p><h3>Señas y cantos</h3><p>Quien tiene cuatro iguales no lo puede decir: le hace una <b>seña</b> a su pareja, y es la pareja quien canta <b>¡Cuadrado!</b> Los rivales pueden pillar la seña y <b>cortar</b> a quien la hizo. Acertar da un punto; equivocarse se lo da a la otra pareja.</p>",

    normas_brisca: "<h2>Normas de la brisca</h2><p>Se juega a dos o a cuatro (por parejas, compañeros enfrentados) con la baraja de 40. Se reparten 3 cartas a cada uno y se vuelve una carta: su palo es el <b>triunfo</b> y queda debajo del mazo.</p><h3>Valores</h3><p>As 11, tres 10, rey 4, caballo 3, sota 2; el resto no suma. En total hay 120 puntos. Orden de fuerza: as, tres, rey, caballo, sota, 7, 6, 5, 4, 2.</p><h3>Juego</h3><p>Sale el mano y cada uno echa una carta, sin obligación de asistir ni de matar. Se lleva la baza la carta más alta del palo de salida, salvo que haya triunfo: entonces gana el triunfo más alto. Tras cada baza se roba una carta empezando por quien la ganó, que sale en la siguiente. La última carta en robarse es la muestra.</p><h3>Cambiar la muestra</h3><p>Quien tenga el 7 de triunfo puede cambiarlo por la muestra si esta es una figura, el tres o el as; si la muestra es baja, se cambia con el 2. Solo antes de echar carta y mientras quede mazo.</p><h3>Cuenta</h3><p>Gana la mano quien pasa de 60 puntos. En un empate a 60 se lleva la mano quien hizo la última baza.</p>",
    normas_tute: "<h2>Normas del tute</h2><p>Cuatro jugadores por parejas, compañeros enfrentados. Se reparten las 40 cartas, diez a cada uno; la última del que reparte marca el <b>triunfo</b>.</p><h3>Valores</h3><p>Como en la brisca: as 11, tres 10, rey 4, caballo 3, sota 2. La última baza vale 10 más (<b>diez de últimas</b>): en total 130.</p><h3>Obligaciones</h3><p>Hay que <b>asistir</b> al palo de salida y <b>montar</b> (superar la carta que va ganando) si se puede. Sin cartas del palo hay que <b>fallar</b> con triunfo, y si ya hay triunfo en la mesa, montarlo si se puede; si no, se echa cualquier carta. Con la opción <i>Montar: pareja</i>, cuando va ganando el compañero no hay obligación de montar ni de fallar.</p><h3>Cantes</h3><p>Quien gana una baza puede cantar, antes de salir, rey y caballo del mismo palo: <b>20</b>, o <b>40</b> si son de triunfo. Un cante por baza. Cuatro reyes o cuatro caballos son <b>tute</b> y ganan la mano al momento.</p><h3>Cuenta</h3><p>Gana la mano la pareja con más puntos (bazas + cantes + diez de últimas).</p>",

    normas_texto: "<h2>Normas del mus</h2>\n<p>Juegan dos parejas enfrentadas con baraja española de 40 cartas. Gana la pareja que antes llega a 40 piedras (8 amarracos). Con <b>8 reyes</b>, los 3 valen como reyes y los 2 como ases.</p>\n<h3>Valores</h3><p>Rey, caballo y sota valen 10 para el juego; el as vale 1; las demás su número. Orden de mayor a menor: rey, caballo, sota, 7, 6, 5, 4, as.</p>\n<h3>La mano</h3><p>Se reparten 4 cartas. Empezando por el mano, cada uno dice <b>mus</b> o <b>no hay mus</b>. Si los cuatro dan mus, cada uno cambia las cartas que quiera y se vuelve a preguntar. El primer \"no hay mus\" corta.</p>\n<h3>Los lances</h3><p><b>Grande</b>: las cartas más altas. <b>Chica</b>: las más bajas. <b>Pares</b>: duples (dos parejas o cuatro iguales), medias (tres iguales) o par; solo apuestan quienes tienen pares. <b>Juego</b>: suma de 31 o más; 31 es el mejor, después 32, 40, 37, 36, 35, 34, 33; solo apuestan quienes tienen juego. Si nadie tiene juego se juega el <b>punto</b>: la suma más cercana a 30. En cualquier empate gana quien esté más cerca del mano.</p>\n<h3>Apuestas</h3><p>En cada lance, desde el mano, cada uno pasa o envida. <b>Envido</b> son 2 piedras; se puede envidar más o lanzar <b>órdago</b> (toda la partida). La pareja contraria responde <b>quiero</b>, <b>no quiero</b> o sube. Si los dos rivales no quieren, quien envidó se apunta ya 1 piedra (o el último envite aceptado si rechazan una subida). Un órdago aceptado destapa las cartas y decide la partida en ese lance.</p>\n<h3>Cuenta</h3><p>Al terminar las apuestas se destapan las cartas y se cuenta en el orden grande, chica, pares, juego o punto. Lance en paso: 1 piedra. Envite aceptado: lo envidado. Pares, por cada jugador de la pareja ganadora: par 1, medias 2, duples 3. Juego: 31 vale 3, otro juego 2. Si solo una pareja tiene pares o juego, se lo lleva sin apostar. La cuenta se para en cuanto una pareja llega a la meta.</p>\n<h3>Señas</h3><p>Las parejas se hacen señas para contarse las cartas sin hablar. En la app se hacen desde la fila de caras; tu pareja siempre las ve y el rival puede pillarlas.</p>",

    normas_solitario: "<h2>Normes del solitari</h2><p>Per jugar sol. Es reparteixen set columnes (d’una a set cartes, només l’última de cara) i la resta queda al munt.</p><h3>Objectiu</h3><p>Portar les 40 cartes a les quatre <b>fundacions</b>, una per pal, en ordre de l’as al rei.</p><h3>Columnes</h3><p>A les columnes es baixa d’una en una <b>alternant pal</b>: mai dues del mateix pal seguides. Pots moure escales senceres. En un forat només hi va un rei.</p><h3>Munt</h3><p>Toca el munt per treure cartes al descart (una o tres). Quan s’acaba, es torna a començar.</p>",

    normas_julepe: "<h2>Normes del julepe</h2><p>De tres a sis jugadors amb fitxes. A cada mà tothom posa una fitxa al pot, es reparteixen cinc cartes i es gira la següent: marca el trumfo.</p><h3>Entrar</h3><p>Des de la mà, cadascú decideix si <b>entra</b> o passa. Si només n’entra un, qui reparteix està obligat a jugar contra ell. Si no n’entra cap, el pot queda per a la mà següent.</p><h3>Joc</h3><p>Juguen només els que han entrat, amb les obligacions del tute.</p><h3>Compte</h3><p>Cada basa cobra la cinquena part del pot. Qui ha entrat i ha fet menys de dues bases fa <b>julepe</b>: paga al pot tant com n’hi havia. Guanya qui acaba amb més fitxes.</p>",
