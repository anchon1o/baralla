    normas_sieteymedia: "<h2>Normes del set i mig</h2><p>De dos a quatre jugadors; la banca roda a cada mà. De l’as al set valen el seu número i les figures, mig punt.</p><h3>Joc</h3><p>Cadascú rep una carta tapada. Al teu torn demanes cartes, que surten descobertes, fins que et plantes; si passes de set i mig, et passes i perds. Al final juga la banca.</p><h3>Compte</h3><p>Guanyes una fitxa si tens més que la banca sense passar-te (dues si fas set i mig amb dues cartes); als empats guanya la banca. Després de les voltes acordades guanya qui té més fitxes.</p>",
    normas_cinquillo: "<h2>Normes del cinquillo</h2><p>Es reparteix tota la baralla. Surt qui té el <b>5 d’ors</b>.</p><h3>Joc</h3><p>Al teu torn col·loques una carta: un cinc d’un altre pal (obre una fila nova) o la carta següent o anterior d’una fila ja oberta del mateix pal (el 7 va seguit de la sota). Si no en tens cap que encaixi, passes.</p><h3>Final</h3><p>Guanya qui es queda abans sense cartes.</p>",
    normas_trintaeunha: "<h2>Normes del trenta-u</h2><p>Tres cartes cadascú i una de cara al descart. L’as val 11, les figures 10 i la resta el seu número. Només sumen les cartes del mateix pal.</p><h3>Joc</h3><p>Al teu torn robes de la pila o del descart i tires una carta. Si creus que tens bona mà, en lloc de robar pots <b>picar</b>: els altres juguen un torn més i es destapa.</p><h3>Compte</h3><p>Qui té la suma més baixa perd una vida. Qui fa <b>31</b> destapa a l’instant i perden tots els altres. Qui es queda sense vides surt; guanya l’últim.</p>",
    normas_mentiroso: "<h2>Normes del mentider</h2><p>Es reparteix tota la baralla. Guanya qui es queda abans sense cartes.</p><h3>Joc</h3><p>Qui surt tira d’una a tres cartes de cara avall i diu un número (per exemple, «reis»). Els següents en tiren també d’una a tres dient que són d’aquest número, sigui veritat o no.</p><h3>Mentider!</h3><p>Abans de tirar, pots acusar l’anterior. Es destapen les seves cartes: si mentia, s’endú tota la pila; si deia la veritat, te l’endús tu. Qui tira l’última carta i no l’enxampen, guanya.</p>",
    normas_burro: "<h2>Normes del ruc</h2><p>Es treu una carta de la baralla sense mirar-la i es reparteix la resta. Cadascú tira les parelles (dues cartes del mateix número) que tingui.</p><h3>Joc</h3><p>Al teu torn agafes una carta a cegues de la mà del següent. Si fa parella, la tires. Qui es queda sense cartes, surt.</p><h3>Final</h3><p>Qui es queda amb l’última carta sense parella és el <b>ruc</b> i s’endú una lletra. Qui completa B-U-R-R-O perd la partida.</p>",

    normas_escoba: "<h2>Normes de l’escombra</h2><p>De dos a quatre jugadors (a quatre, per parelles). Valors: de l’as al set el seu número, sota 8, cavall 9, rei 10.</p><h3>Joc</h3><p>Es reparteixen tres cartes a cadascú i quatre de cara a la taula. Al teu torn tires una carta: si amb cartes de la taula suma <b>15</b>, te les endús; si no, es queda a la taula. Si t’endús totes les de la taula fas <b>escombra</b>. Quan s’acaben les mans es reparteixen tres més fins acabar la pila; el que quedi a la taula se l’endú qui ha recollit l’última vegada.</p><h3>Compte</h3><p>Un punt per cada escombra, per tenir més cartes, més ors, més sets i pel set d’ors. Guanya qui arriba abans a la meta.</p>",
    normas_chinchon: "<h2>Normes del chinchón</h2><p>De dos a quatre jugadors, set cartes cadascú. Les figures valen 10 i la resta el seu número.</p><h3>Jugades</h3><p><b>Trios i quartets</b> del mateix número i <b>escales</b> de tres o més cartes seguides del mateix pal (el 7 va seguit de la sota).</p><h3>Torn</h3><p>Robes de la pila o la carta de dalt del descart i després en tires una. Si després de tirar les cartes soltes sumen 5 o menys, pots <b>tancar</b>: tothom suma els punts de les cartes soltes. Qui tanca sense soltes resta 10, i qui tanca amb una escala de set guanya la partida: això és el <b>chinchón</b>.</p><h3>Final</h3><p>Qui passa del límit queda fora; guanya l’últim que queda.</p>",
    normas_tutecabron: "<h2>Normes del tute cabró</h2><p>El tute de sempre però cadascú pel seu compte, a tres o a quatre (a tres es treu el 2 d’ors i es reparteixen tretze cartes).</p><h3>Joc</h3><p>Les mateixes obligacions que al tute: assistir, muntar i fallar si es pot. Qui guanya una basa pot cantar 20 o 40, i el tute (quatre reis o quatre cavalls) guanya la mà. L’última basa val 10.</p><h3>Compte</h3><p>S’emporta la mà qui fa més punts.</p>",
    normas_subastado: "<h2>Normes del tute subhastat</h2><p>Quatre jugadors, deu cartes cadascú i sense trumfo a la vista.</p><h3>Subhasta</h3><p>Des de la mà, cadascú puja els punts que es compromet a fer (des de 60, de cinc en cinc) o passa i ja no hi torna. Qui es queda la subhasta tria la <b>pinta</b> (el trumfo) i juga sol contra els altres tres.</p><h3>Joc</h3><p>Obligacions del tute: assistir, muntar i fallar. Cants de 20 i 40 i deu d’últimes.</p><h3>Compte</h3><p>Si qui ha pujat arriba als punts, s’apunta dues marques; si no, els altres se n’apunten una cadascú. Guanya qui arriba abans a la meta.</p>",
    normas_pocha: "<h2>Normes de la pocha</h2><p>Quatre jugadors. Cada ronda es reparteix una carta més (1, 2, 3… fins a 10 i, a la partida llarga, torna a baixar). La carta següent de la pila, o l’última de qui reparteix, marca el trumfo.</p><h3>Apostes</h3><p>Abans de jugar, cadascú diu quantes bases farà. L’últim no pot apostar un número que faci que la suma quadri amb les bases de la ronda.</p><h3>Joc</h3><p>Cal assistir, muntar i fallar si es pot.</p><h3>Compte</h3><p>Si fas exactament el que has apostat, sumes 10 més 5 per basa; si no, restes 5 per cada basa de diferència. Guanya qui acaba amb més punts.</p>",
    normas_cuadrado: "<h2>Normes del quadrat</h2><p>Quatre jugadors per parelles. Cadascú té quatre cartes i n’hi ha quatre de cara a la taula. L’objectiu és ajuntar <b>quatre iguals</b>.</p><h3>Torn</h3><p>En aquesta versió per torns, cadascú canvia una carta de la mà per una de la taula o passa. Si passen els quatre seguits, la taula es renova amb quatre cartes de la pila.</p><h3>Senyes i cants</h3><p>Qui té quatre iguals no ho pot dir: fa una <b>senya</b> a la seva parella, i és la parella qui canta <b>Quadrat!</b> Els rivals poden enxampar la senya i <b>tallar</b> qui l’ha feta. Encertar dona un punt; equivocar-se el dona a l’altra parella.</p>",

    normas_brisca: "<h2>Normes de la brisca</h2><p>Es juga a dos o a quatre (per parelles, companys enfrontats) amb la baralla de 40. Es reparteixen 3 cartes a cadascú i es gira una carta: el seu pal és el <b>trumfo</b> i queda sota la pila.</p><h3>Valors</h3><p>As 11, tres 10, rei 4, cavall 3, sota 2; la resta no suma. En total hi ha 120 punts. Ordre de força: as, tres, rei, cavall, sota, 7, 6, 5, 4, 2.</p><h3>Joc</h3><p>Surt la mà i cadascú tira una carta, sense obligació d’assistir ni de matar. S’emporta la basa la carta més alta del pal de sortida, tret que hi hagi trumfo: aleshores guanya el trumfo més alt. Després de cada basa es roba començant per qui l’ha guanyada, que surt a la següent. L’última carta que es roba és la mostra.</p><h3>Canviar la mostra</h3><p>Qui tingui el 7 de trumfo el pot canviar per la mostra si és una figura, el tres o l’as; si la mostra és baixa, es canvia amb el 2. Només abans de tirar carta i mentre quedi pila.</p><h3>Compte</h3><p>Guanya la mà qui passa de 60 punts. En un empat a 60 s’emporta la mà qui ha fet l’última basa.</p>",
    normas_tute: "<h2>Normes del tute</h2><p>Quatre jugadors per parelles, companys enfrontats. Es reparteixen les 40 cartes, deu a cadascú; l’última de qui reparteix marca el <b>trumfo</b>.</p><h3>Valors</h3><p>Com a la brisca: as 11, tres 10, rei 4, cavall 3, sota 2. L’última basa val 10 més (<b>deu d’últimes</b>): en total 130.</p><h3>Obligacions</h3><p>Cal <b>assistir</b> al pal de sortida i <b>muntar</b> (superar la carta que guanya) si es pot. Sense cartes del pal cal <b>fallar</b> amb trumfo, i si ja hi ha trumfo a la taula, muntar-lo si es pot; si no, es tira qualsevol carta. Amb l’opció <i>Muntar: parella</i>, quan guanya el company no cal muntar ni fallar.</p><h3>Cants</h3><p>Qui guanya una basa pot cantar, abans de sortir, rei i cavall del mateix pal: <b>20</b>, o <b>40</b> si són de trumfo. Un cant per basa. Quatre reis o quatre cavalls són <b>tute</b> i guanyen la mà a l’instant.</p><h3>Compte</h3><p>Guanya la mà la parella amb més punts (bases + cants + deu d’últimes).</p>",

    normas_texto: "<h2>Normes del mus</h2>\n<p>Juguen dues parelles enfrontades amb baralla espanyola de 40 cartes. Guanya la parella que arriba abans a 40 pedres (8 amarracos). Amb <b>8 reis</b>, els 3 valen com a reis i els 2 com a asos.</p>\n<h3>Valors</h3><p>Rei, cavall i sota valen 10 per al joc; l'as val 1; les altres el seu número. Ordre de més a menys: rei, cavall, sota, 7, 6, 5, 4, as.</p>\n<h3>La mà</h3><p>Es reparteixen 4 cartes. Començant per la mà, cadascú diu <b>mus</b> o <b>no hi ha mus</b>. Si els quatre donen mus, cadascú canvia les cartes que vulgui i es torna a preguntar. El primer \"no hi ha mus\" talla.</p>\n<h3>Les jugades</h3><p><b>Gran</b>: les cartes més altes. <b>Petita</b>: les més baixes. <b>Parells</b>: duples (dues parelles o quatre iguals), mitges (tres iguals) o parell; només aposten els qui tenen parells. <b>Joc</b>: suma de 31 o més; 31 és el millor, després 32, 40, 37, 36, 35, 34, 33; només aposten els qui tenen joc. Si ningú té joc es juga el <b>punt</b>: la suma més propera a 30. En qualsevol empat guanya qui és més a prop de la mà.</p>\n<h3>Apostes</h3><p>A cada jugada, des de la mà, cadascú passa o envida. <b>Envit</b> són 2 pedres; es pot envidar més o fer <b>òrdago</b> (tota la partida). La parella contrària respon <b>vull</b>, <b>no vull</b> o puja. Si els dos rivals no volen, qui ha envidat s'apunta 1 pedra (o l'últim envit acceptat si rebutgen una pujada). Un òrdago acceptat destapa les cartes i decideix la partida en aquella jugada.</p>\n<h3>Compte</h3><p>En acabar les apostes es destapen les cartes i es compta en l'ordre gran, petita, parells, joc o punt. Jugada en pas: 1 pedra. Envit acceptat: l'envidat. Parells, per cada jugador de la parella guanyadora: parell 1, mitges 2, duples 3. Joc: 31 val 3, un altre joc 2. Si només una parella té parells o joc, s'ho endú sense apostar. El compte s'atura quan una parella arriba a la meta.</p>\n<h3>Senyes</h3><p>Les parelles es fan senyes per explicar-se les cartes sense parlar. A l'app es fan des de la filera de cares; la teva parella sempre les veu i el rival les pot enxampar.</p>",

    normas_solitario: "<h2>Bakarkakoaren arauak</h2><p>Bakarrik jokatzeko. Zazpi zutabe banatzen dira (karta batetik zazpira, azkena bakarrik ahoz gora) eta gainerakoak pilan geratzen dira.</p><h3>Helburua</h3><p>40 kartak lau <b>oinarrietara</b> eramatea, palo bakoitzeko bat, batekotik erregera.</p><h3>Zutabeak</h3><p>Zutabeetan banan-banan jaisten da <b>paloa txandakatuz</b>: inoiz ez palo bereko bi jarraian. Eskailera osoak mugi ditzakezu. Hutsune batean errege bat bakarrik.</p><h3>Pila</h3><p>Sakatu pila deskartera kartak ateratzeko (bat edo hiru). Amaitzean berriro hasten da.</p>",

    normas_julepe: "<h2>Julepearen arauak</h2><p>Hiru eta sei jokalari artean fitxekin. Esku bakoitzean guztiek fitxa bat jartzen dute potoan, bost karta banatzen dira eta hurrengoa buelta ematen da: triunfoa markatzen du.</p><h3>Sartu</h3><p>Eskutik hasita, bakoitzak <b>sartu</b> ala pasatu erabakitzen du. Bakarra sartzen bada, banatzailea haren aurka jokatzera behartuta dago. Inor sartzen ez bada, potoa hurrengo eskurako geratzen da.</p><h3>Jokoa</h3><p>Sartu direnek bakarrik jokatzen dute, tutearen betebeharrekin.</p><h3>Kontua</h3><p>Baza bakoitzak potoaren bosten bat kobratzen du. Sartu eta bi baza baino gutxiago egiten dituenak <b>julepea</b> du: potoan zegoen adina ordaintzen du. Fitxa gehien dituenak irabazten du.</p>",

    normas_sieteymedia: "<h2>Zazpi t'erdiren arauak</h2><p>Bi eta lau jokalari artean; banka esku bakoitzean aldatzen da. Batekotik zazpikora beren zenbakia balio dute eta irudiek puntu erdi.</p><h3>Jokoa</h3><p>Bakoitzak karta estali bat jasotzen du. Zure txandan kartak eskatzen dituzu, agerian, gelditu arte; zazpi t'erdi gainditzen baduzu, pasatzen zara eta galtzen duzu. Amaieran bankak jokatzen du.</p><h3>Kontua</h3><p>Fitxa bat irabazten duzu bankak baino gehiago baduzu pasatu gabe (bi, bi kartarekin zazpi t'erdi egiten baduzu); berdinketetan bankak irabazten du.</p>",
    normas_cinquillo: "<h2>Cinquilloren arauak</h2><p>Sorta osoa banatzen da. <b>Urrezko 5a</b> duenak irteten du.</p><h3>Jokoa</h3><p>Zure txandan karta bat jartzen duzu: beste palo bateko bosteko bat (ilara berria irekitzen du) edo palo bereko ilara ireki bateko hurrengo edo aurreko karta. Ondo datorren kartarik ez baduzu, paso.</p><h3>Amaiera</h3><p>Lehenengo kartarik gabe geratzen denak irabazten du.</p>",
    normas_trintaeunha: "<h2>Hogeita hamaikaren arauak</h2><p>Hiru karta bakoitzak eta bat ahoz gora deskartean. Batekoak 11 balio du, irudiek 10 eta gainerakoek beren zenbakia. Palo bereko kartak bakarrik batzen dira.</p><h3>Jokoa</h3><p>Zure txandan sortatik edo deskartetik hartu eta karta bat botatzen duzu. Esku ona duzula uste baduzu, hartu beharrean <b>jo</b> dezakezu: besteek txanda bat gehiago jokatzen dute eta kartak erakusten dira.</p><h3>Kontua</h3><p>Batura txikiena duenak bizitza bat galtzen du. <b>31</b> egiten duenak berehala erakusten ditu eta beste guztiek galtzen dute. Azken geratzen denak irabazten du.</p>",
    normas_mentiroso: "<h2>Gezurtiaren arauak</h2><p>Sorta osoa banatzen da. Lehenengo kartarik gabe geratzen denak irabazten du.</p><h3>Jokoa</h3><p>Irteten denak bat eta hiru karta artean botatzen ditu ahoz behera eta zenbaki bat esaten du. Hurrengoek ere bat eta hiru artean botatzen dituzte zenbaki horretakoak direla esanez, egia izan ala ez.</p><h3>Gezurtia!</h3><p>Bota aurretik, aurrekoa sala dezakezu. Bere kartak erakusten dira: gezurretan bazebilen, pila osoa eramaten du; egia bazioen, zuk eramaten duzu.</p>",
    normas_burro: "<h2>Astoaren arauak</h2><p>Sortatik karta bat kentzen da begiratu gabe eta gainerakoak banatzen dira. Bakoitzak dituen bikoteak botatzen ditu.</p><h3>Jokoa</h3><p>Zure txandan hurrengoaren eskutik karta bat hartzen duzu itsuan. Bikotea egiten badu, bota egiten duzu. Kartarik gabe geratzen dena ateratzen da.</p><h3>Amaiera</h3><p>Bikoterik gabeko azken kartarekin geratzen dena <b>astoa</b> da eta letra bat hartzen du. B-U-R-R-O osatzen duenak galtzen du.</p>",

    normas_escoba: "<h2>Erratzaren arauak</h2><p>Bi eta lau jokalari artean (lau badira, bikoteka). Balioak: batekotik zazpikora bere zenbakia, txanka 8, zaldia 9, erregea 10.</p><h3>Jokoa</h3><p>Bakoitzari hiru karta banatzen zaizkio eta lau mahai gainean ahoz gora. Zure txandan karta bat botatzen duzu: mahaiko kartekin <b>15</b> batzen badu, eraman egiten dituzu; bestela mahaian geratzen da. Mahaiko guztiak eramaten badituzu <b>erratza</b> egiten duzu. Eskuak amaitzean beste hiru banatzen dira sorta amaitu arte.</p><h3>Kontua</h3><p>Puntu bat erratza bakoitzeko, karta gehien, urre gehien, zazpiko gehien eta urrezko zazpikoagatik. Helmugara lehenengo iristen denak irabazten du.</p>",
    normas_chinchon: "<h2>Chinchónaren arauak</h2><p>Bi eta lau jokalari artean, zazpi karta bakoitzak. Irudiek 10 balio dute eta gainerakoek beren zenbakia.</p><h3>Jokaldiak</h3><p>Zenbaki bereko <b>hirukoak eta laukoak</b> eta palo bereko hiru karta edo gehiagoko <b>eskailerak</b> (7aren ondoren txanka).</p><h3>Txanda</h3><p>Sortatik edo deskarteko goiko kartatik hartzen duzu eta gero bat botatzen duzu. Bota ondoren karta solteek 5 edo gutxiago batzen badute, <b>itxi</b> dezakezu. Soltekorik gabe ixten duenak 10 kentzen ditu, eta zazpiko eskailerarekin ixten duenak partida irabazten du: hori da <b>chinchóna</b>.</p><h3>Amaiera</h3><p>Muga gainditzen duena kanpoan geratzen da; geratzen den azkenak irabazten du.</p>",
    normas_tutecabron: "<h2>Tute cabronaren arauak</h2><p>Ohiko tutea baina bakoitza bere kabuz, hiruzpalau jokalarirekin (hirurekin urrezko 2a kentzen da eta hamahiru karta banatzen dira).</p><h3>Jokoa</h3><p>Tutearen betebehar berak: jarraitu, gainditu eta moztu ahal bada. Baza irabazten duenak 20 edo 40 kanta ditzake, eta tuteak eskua irabazten du. Azken bazak 10 balio du.</p><h3>Kontua</h3><p>Puntu gehien egiten duenak eramaten du eskua.</p>",
    normas_subastado: "<h2>Tute enkantearen arauak</h2><p>Lau jokalari, hamar karta bakoitzak eta triunforik agerian gabe.</p><h3>Enkantea</h3><p>Eskutik hasita, bakoitzak egingo dituen puntuak eskaintzen ditu (60tik aurrera, bostetik bostera) edo pasatzen da eta ez da berriro sartzen. Enkantea irabazten duenak <b>pinta</b> (triunfoa) aukeratzen du eta bakarrik jokatzen du beste hiruren aurka.</p><h3>Jokoa</h3><p>Tutearen betebeharrak, 20 eta 40ko kantuak eta azkenekoen hamarra.</p><h3>Kontua</h3><p>Eskaini duena puntuetara iristen bada, bi marka; bestela, beste bakoitzak bat. Helmugara lehenengo iristen denak irabazten du.</p>",
    normas_pocha: "<h2>Pocharen arauak</h2><p>Lau jokalari. Txanda bakoitzean karta bat gehiago banatzen da (1, 2, 3… 10 arte eta, partida luzean, berriro behera). Sortako hurrengo kartak edo banatzailearen azkenak markatzen du triunfoa.</p><h3>Apustuak</h3><p>Jokatu aurretik, bakoitzak zenbat baza egingo dituen esaten du. Azkenak ezin du batura txandako bazekin bat etortzea eragiten duen zenbakirik apustatu.</p><h3>Jokoa</h3><p>Jarraitu, gainditu eta moztu behar da ahal bada.</p><h3>Kontua</h3><p>Apustatutakoa zehatz egiten baduzu, 10 gehi 5 baza bakoitzeko; bestela, 5 kentzen dira alde bakoitzeko. Puntu gehienekin amaitzen duenak irabazten du.</p>",
    normas_cuadrado: "<h2>Karratuaren arauak</h2><p>Lau jokalari bikoteka. Bakoitzak lau karta ditu eta lau daude mahaian ahoz gora. Helburua <b>lau berdin</b> biltzea da.</p><h3>Txanda</h3><p>Txandakako bertsio honetan, bakoitzak eskuko karta bat mahaikoarekin aldatzen du edo pasatzen da. Laurak jarraian pasatzen badira, mahaia sortako lau kartarekin berritzen da.</p><h3>Keinuak eta kantuak</h3><p>Lau berdin dituenak ezin du esan: bikoteari <b>keinua</b> egiten dio, eta bikoteak kantatzen du <b>Karratua!</b> Aurkariek keinua harrapa dezakete eta egin duena <b>moztu</b>. Asmatzeak puntu bat ematen du; huts egiteak beste bikoteari.</p>",

    normas_brisca: "<h2>Briscaren arauak</h2><p>Bi edo lau jokalarik jokatzen dute (bikoteka, lagunak aurrez aurre) 40 kartako sortarekin. Bakoitzari 3 karta banatzen zaizkio eta karta bat buelta ematen da: bere paloa <b>triunfoa</b> da eta sortaren azpian geratzen da.</p><h3>Balioak</h3><p>Batekoa 11, hirukoa 10, erregea 4, zaldia 3, txanka 2; gainerakoek ez dute batzen. Guztira 120 puntu. Indar ordena: batekoa, hirukoa, erregea, zaldia, txanka, 7, 6, 5, 4, 2.</p><h3>Jokoa</h3><p>Eskuak irteten du eta bakoitzak karta bat botatzen du, paloari jarraitzeko edo hiltzeko betebeharrik gabe. Irteerako paloaren kartarik altuenak eramaten du baza, triunforik ez badago; bestela triunforik altuenak. Baza bakoitzaren ondoren, irabazleak lehenengo hartzen du karta eta hark irteten du hurrengoan.</p><h3>Erakusgarria aldatu</h3><p>Triunfoko 7a duenak erakusgarriarekin alda dezake irudia, hirukoa edo batekoa bada; baxua bada, 2arekin. Karta bota aurretik eta sortan kartak dauden bitartean.</p><h3>Kontua</h3><p>60 puntu baino gehiago dituenak irabazten du eskua. 60ko berdinketan azken baza egin duenak eramaten du.</p>",
    normas_tute: "<h2>Tutearen arauak</h2><p>Lau jokalari bikoteka, lagunak aurrez aurre. 40 kartak banatzen dira, hamar bakoitzari; banatzailearen azkenak markatzen du <b>triunfoa</b>.</p><h3>Balioak</h3><p>Briscan bezala: batekoa 11, hirukoa 10, erregea 4, zaldia 3, txanka 2. Azken bazak 10 gehiago balio du: guztira 130.</p><h3>Betebeharrak</h3><p>Irteerako paloari <b>jarraitu</b> eta irabazten ari den karta <b>gainditu</b> behar da ahal bada. Paloko kartarik gabe triunfoarekin <b>moztu</b> behar da, eta mahaian triunfoa badago, gainditu ahal bada; bestela edozein karta bota daiteke. <i>Gainditu: bikotea</i> aukerarekin, laguna irabazten ari denean ez dago gainditzeko edo mozteko betebeharrik.</p><h3>Kantuak</h3><p>Baza bat irabazten duenak, irten aurretik, palo bereko erregea eta zaldia kanta ditzake: <b>20</b>, edo <b>40</b> triunfokoak badira. Kantu bat baza bakoitzeko. Lau errege edo lau zaldi <b>tutea</b> dira eta eskua berehala irabazten dute.</p><h3>Kontua</h3><p>Puntu gehien dituen bikoteak irabazten du eskua (bazak + kantuak + azkenekoen hamarra).</p>",

    case 'empezou': rexistrarTexto(t('e_empezou'), 'nos'); break;
    case 'MUS': ditos[e.asento] = t('d_mus'); rexistrarTexto(t('e_mus', { n: quen(e.asento) }), cls(e.asento)); if (alleo(e.asento)) son('xogada'); break;
    case 'NON_MUS': ditos[e.asento] = t('d_nonmus'); rexistrarTexto(t('e_nonmus', { n: quen(e.asento) }), cls(e.asento)); if (alleo(e.asento)) son('xogada'); break;
    case 'descartou': ditos[e.asento] = t('e_cambia', { n: e.n }); if (alleo(e.asento)) son('xogada'); break;
    case 'novaRoldaMus': ditos = ['', '', '', '']; rexistrarTexto(t('e_repostas')); break;
    case 'rebarallar': rexistrarTexto(t('e_rebarallar')); break;
    case 'lance': ditos = ['', '', '', '']; rexistrarTexto('— ' + L(e.lance) + ' —'); break;
    case 'declarar': ditos = ['', '', '', '']; break;
    case 'declarou': ditos[e.asento] = t(e.lance === 'pares' ? 'd_pares' : 'd_xogo') + t(e.ten ? 'd_si' : 'd_non'); if (alleo(e.asento)) son('xogada'); break;
    case 'lanceSenRival': rexistrarTexto(t('e_senrival', { l: L(e.lance), p: par(e.parella) }), 'pedras'); avisar(t('e_senrival_curto', { l: L(e.lance), p: par(e.parella) })); break;
    case 'lanceSaltado': rexistrarTexto(t('e_senpares')); avisar(t('e_senpares')); break;
    case 'PASAR': ditos[e.asento] = t('d_paso'); rexistrarTexto(t('e_paso', { n: quen(e.asento) }), cls(e.asento)); if (alleo(e.asento)) son('xogada'); break;
    case 'ENVIDAR': ditos[e.asento] = t(e.subida ? 'd_mais' : 'd_envido', { c: e.cantidade }); rexistrarTexto(t(e.subida ? 'e_sobe' : 'e_envida', { n: quen(e.asento), c: e.cantidade }), cls(e.asento)); if (alleo(e.asento)) son('envite'); break;
    case 'ORDAGO': ditos[e.asento] = t('d_ordago'); rexistrarTexto(t('e_ordago', { n: quen(e.asento) }), 'pedras'); if (alleo(e.asento)) son('envite'); break;
    case 'QUERO': ditos[e.asento] = t('d_quero'); rexistrarTexto(t('e_quero', { n: quen(e.asento) }), cls(e.asento)); if (alleo(e.asento)) son('xogada'); break;
    case 'NON_QUERO': ditos[e.asento] = t('d_nonquero'); rexistrarTexto(t('e_nonquero', { n: quen(e.asento) }), cls(e.asento)); if (alleo(e.asento)) son('xogada'); break;
    case 'deixada': rexistrarTexto(t('e_deixada', { l: L(e.lance), c: e.pedras, p: par(e.parella) }), 'pedras'); avisar(t('e_deixada_curto', { c: e.pedras, p: par(e.parella) })); break;
    case 'lanceEnPaso': rexistrarTexto(t('e_enpaso', { l: L(e.lance) })); break;
    case 'pedras': { const lm = String(e.motivo).replace(/^deixada /, ''); rexistrarTexto(t('e_pedras', { c: e.pedras, p: par(e.parella), l: L(lm) }), 'pedras'); son('pedras'); break; }
    case 'conta': rexistrarTexto(t('e_conta', { m: e.marcador.join('–') }), 'pedras'); break;
    case 'ordago': rexistrarTexto(t('e_ordago_gana', { l: L(e.lance), p: par(e.gañador.parella) }), 'pedras'); break;
    case 'partida': rexistrarTexto(t('e_partida', { p: par(e.parella) }), 'pedras'); break;
    case 'fin': rexistrarTexto(t('e_fin', { p: par(e.parella) }), 'pedras'); son('fin'); break;
    case 'desconectou': rexistrarTexto(t('e_desconectou', { n: quen(e.asento) })); break;
    case 'sinalPropia': rexistrarTexto(t('e_sinalpropia', { s: nomeSinal(e.sinal) })); break;
  }
  if (vista) pintar();
}
})();
